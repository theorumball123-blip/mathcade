<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mage Run &mdash; Mathcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   style.css — shared look for every page.
   Exercise book: graph paper, ballpoint blue, red teacher's pen.
   ============================================================ */

:root {
  --paper:      #F2F6FB;
  --grid:       #CFE0F2;
  --ink:        #16324F;
  --ink-soft:   #5C7490;
  --red-pen:    #E03B3B;
  --gold:       #FFC53D;
  --mint:       #3FC99A;
  --grape:      #8B6BDB;

  --shadow-sticker: 2px 3px 0 rgba(22, 50, 79, 0.18);
  --radius: 14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Nunito', system-ui, sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  /* the graph paper */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
}

h1, h2, h3, .chunky {
  font-family: 'Fredoka', 'Nunito', sans-serif;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.page {
  max-width: 940px;
  margin: 0 auto;
  padding: 20px 18px 64px;
}

/* --- the header strip, like the front of an exercise book --- */
.book-label {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sticker);
  padding: 16px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  align-items: center;
  justify-content: space-between;
}

.book-label h1 {
  margin: 0;
  font-size: clamp(1.6rem, 6vw, 2.4rem);
}

.book-label h1 .dot { color: var(--red-pen); }

.stats {
  display: flex;
  gap: 16px;
  font-weight: 700;
}

.stat {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.stat .figure {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.5rem;
  line-height: 1;
}

.stat .caption {
  font-size: 0.78rem;
  color: var(--ink-soft);
  font-weight: 600;
}

.coins .figure  { color: #C98B00; }
.streak .figure { color: var(--mint); }
.level .figure  { color: var(--grape); }

/* ============================================================
   Overall level — one level across every game, shown on the hub.
   The maths level (1-8) is a different thing and lives in the games.
   ============================================================ */

.overall { min-width: min(300px, 100%); }

.ov-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 7px;
}

.ov-level {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.6rem;
  line-height: 1;
  color: var(--grape);
}

.ov-level .word {
  font-family: 'Nunito', sans-serif;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  color: var(--ink-soft);
  margin-right: 6px;
}

.ov-coins {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.25rem;
  color: #C98B00;
  white-space: nowrap;
}

.ov-track {
  height: 14px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--paper);
  overflow: hidden;
}

.ov-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--mint), var(--gold));
  transition: width 0.4s ease-out;
}

.ov-note {
  display: block;
  margin-top: 6px;
  font-size: 0.76rem;
  font-weight: 800;
  color: var(--ink-soft);
}

/* --- the warm-up question card --- */
.warmup {
  margin-top: 26px;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sticker);
  padding: 26px 22px;
  text-align: center;
}

.warmup .prompt {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(2.2rem, 11vw, 3.6rem);
  margin: 6px 0 18px;
  line-height: 1.1;
}

.warmup .meta {
  font-size: 0.85rem;
  color: var(--ink-soft);
  font-weight: 700;
}

.answer-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

input[type="number"] {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.5rem;
  width: 140px;
  padding: 10px 14px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  text-align: center;
}

input[type="number"]:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--grape);
  outline-offset: 2px;
}

/* stop the little spinner arrows */
input[type="number"]::-webkit-inner-spin-button { appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

button {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.1rem;
  padding: 11px 24px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--gold);
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow-sticker);
}

button:active { transform: translate(2px, 3px); box-shadow: none; }

/* --- feedback line, written in red pen when you're wrong --- */
.feedback {
  min-height: 1.6em;
  margin-top: 14px;
  font-weight: 800;
}

.feedback.good  { color: var(--mint); }
.feedback.bad   { color: var(--red-pen); }

/* --- the game grid: each tile is a picture of the game being played --- */
.shelf {
  display: grid;
  /* the max matters as much as the min — with 1fr, two tiles on a wide page
     stretched to half the page each. Cap it and they stay tile-sized. */
  grid-template-columns: repeat(auto-fit, minmax(175px, 215px));
  justify-content: start;
  gap: 16px;
}

/* on a phone, one tile per row, full width — a 215px column left a strip of nothing */
@media (max-width: 520px) {
  .shelf { grid-template-columns: 1fr; }
  .tile:nth-child(n) { transform: none; }
}

.tile {
  display: block;
  text-decoration: none;
  color: var(--ink);
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sticker);
  transition: transform 0.14s ease, box-shadow 0.14s ease;
}

/* each tile sits a touch crooked, like a sticker on the page */
.tile:nth-child(4n+1) { transform: rotate(-0.7deg); }
.tile:nth-child(4n+2) { transform: rotate(0.55deg); }
.tile:nth-child(4n+3) { transform: rotate(0.4deg); }
.tile:nth-child(4n+4) { transform: rotate(-0.45deg); }

.tile:hover,
.tile:focus-visible {
  transform: rotate(0deg) translateY(-4px);
  box-shadow: 4px 8px 0 rgba(22, 50, 79, 0.22);
}

/* the picture */
.tile .cover {
  display: block;
  aspect-ratio: 4 / 3;
  border-bottom: 2px solid var(--ink);
  background: #090F22;
  overflow: hidden;
}

.tile .cover svg { display: block; width: 100%; height: 100%; }

/* a tile with no artwork yet can still use a big emoji */
.tile .cover.emoji {
  display: grid;
  place-items: center;
  font-size: clamp(2.4rem, 9vw, 3.4rem);
}

.cover.blue  { background: #BFE3FF; }
.cover.mint  { background: #C4F0DF; }
.cover.gold  { background: #FFE6A8; }
.cover.grape { background: #DCD2F7; }

.tile-body { display: block; padding: 10px 12px 12px; }

.tile .name {
  display: block;
  font-family: 'Fredoka', sans-serif;
  font-size: 1.02rem;
  text-align: left;
  padding: 0;
  line-height: 1.15;
}

.tile .blurb {
  display: block;
  margin-top: 3px;
  font-size: 0.74rem;
  font-weight: 700;
  line-height: 1.4;
  color: var(--ink-soft);
}

.tile .prog {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  min-height: 13px;
}

.tile .prog-track {
  flex: 1;
  height: 9px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--paper);
  overflow: hidden;
}

.tile .prog-fill {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--mint), var(--gold));
  transition: width 0.5s ease-out;
}

.tile .state {
  display: block;
  text-align: left;
  font-size: 0.7rem;
  font-weight: 800;
  padding: 0;
  color: var(--ink-soft);
}

.tile .state b { color: var(--ink); }
.tile .state.go { color: var(--mint); }

.tile.locked { opacity: 0.62; }
.tile.locked .state { color: var(--ink-soft); }
.tile.locked:hover { transform: rotate(0deg); box-shadow: var(--shadow-sticker); }

footer {
  margin-top: 46px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

footer button.armed { background: var(--red-pen); color: #fff; border-color: var(--red-pen); }

footer button {
  font-size: 0.85rem;
  padding: 6px 14px;
  background: #fff;
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

@media (max-width: 520px) {
  .book-label { flex-direction: column; align-items: flex-start; }
  .stats { gap: 18px; }
}

/* ============================================================
   Question pop-up (js/quiz.js)
   ============================================================ */

.quiz-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10, 22, 36, 0.66);
  backdrop-filter: blur(3px);
  z-index: 50;
}

.quiz-backdrop.open { display: flex; }

.quiz-card {
  width: min(430px, 100%);
  background: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  box-shadow: 5px 7px 0 rgba(0, 0, 0, 0.35);
  padding: 24px 22px;
  text-align: center;
}

.quiz-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.35rem;
  margin: 0;
}

.quiz-subtitle {
  margin: 4px 0 0;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--ink-soft);
}

.quiz-pips {
  display: flex;
  gap: 7px;
  justify-content: center;
  margin: 14px 0 6px;
}

.pip {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: #fff;
}

.pip.lit { background: var(--mint); }

.quiz-prompt {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(2rem, 9vw, 2.9rem);
  margin: 8px 0 18px;
  line-height: 1.1;
}

.shake { animation: shake 0.32s ease; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-9px); }
  75%      { transform: translateX(9px); }
}

/* ============================================================
   In-game HUD — the keycap row
   ============================================================ */

.game-body {
  margin: 0;
  overflow: hidden;
  background: #0A1624;
}

canvas { display: block; }

.hud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  pointer-events: none;
  font-family: 'Fredoka', sans-serif;
  color: #fff;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
}

.keycaps { display: flex; gap: 7px; flex-wrap: wrap; }

.keycap {
  min-width: 42px;
  height: 42px;
  padding: 0 9px;
  display: grid;
  place-items: center;
  font-size: 0.95rem;
  border-radius: 9px;
  border: 2px solid rgba(255, 255, 255, 0.28);
  background: rgba(255, 255, 255, 0.07);
  color: rgba(255, 255, 255, 0.34);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3);
}

.keycap.lit {
  border-color: #fff;
  background: var(--gold);
  color: var(--ink);
  text-shadow: none;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), 0 0 16px rgba(255, 197, 61, 0.7);
}

.keycap.pressed { transform: translateY(3px); box-shadow: none; }

.hud-right { text-align: right; line-height: 1.35; }
.hud-right .big { font-size: 1.5rem; }
.hud-right .small { font-size: 0.85rem; opacity: 0.85; font-family: 'Nunito', sans-serif; font-weight: 700; }

.banner {
  position: fixed;
  left: 50%;
  top: 34%;
  transform: translate(-50%, -50%);
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  color: #fff;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
  pointer-events: none;
  opacity: 0;
  text-align: center;
  transition: opacity 0.3s ease;
}

.banner.show { opacity: 1; }

.back-link {
  position: fixed;
  left: 16px;
  bottom: 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.7);
  text-decoration: none;
  z-index: 20;
}

.back-link:hover { color: #fff; }

/* ============================================================
   Featured game panel on the hub — a dark window into the game
   world, sitting on the paper page
   ============================================================ */

.featured {
  margin-top: 26px;
  background: #16324F;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  box-shadow: 4px 6px 0 rgba(22, 50, 79, 0.28);
  padding: 26px 24px;
  color: #fff;
}

.featured h2 {
  margin: 0;
  font-size: clamp(1.7rem, 6vw, 2.5rem);
}

.featured p {
  margin: 8px 0 0;
  max-width: 52ch;
  color: #BBD3EC;
  font-weight: 600;
  line-height: 1.5;
}

.featured .keycaps {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin: 20px 0 22px;
  font-family: 'Fredoka', sans-serif;
}

.featured .play {
  display: inline-block;
  font-family: 'Fredoka', sans-serif;
  font-size: 1.15rem;
  padding: 12px 30px;
  border: 2px solid #0A1624;
  border-radius: 10px;
  background: var(--gold);
  color: var(--ink);
  text-decoration: none;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.45);
}

.featured .play:active { transform: translate(2px, 3px); box-shadow: none; }

/* ============================================================
   End-of-game results screen (js/results.js)
   ============================================================ */

.results-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10, 22, 36, 0.72);
  backdrop-filter: blur(4px);
  z-index: 60;
}

.results-backdrop.open { display: flex; }

.results-card {
  position: relative;
  overflow: hidden;
  width: min(430px, 100%);
  background: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  box-shadow: 5px 7px 0 rgba(0, 0, 0, 0.4);
  padding: 26px 22px 22px;
  text-align: center;
}

.results-title {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(1.7rem, 7vw, 2.3rem);
  margin: 0;
}

.results-sub {
  margin: 4px 0 20px;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--ink-soft);
}

.results-stats {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 22px;
}

.results-stat {
  flex: 1;
  max-width: 116px;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 14px;
  padding: 13px 8px;
  opacity: 0;
  transform: scale(0.6) translateY(8px);
}

.results-stat.pop {
  animation: statPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes statPop {
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.results-figure {
  display: block;
  font-family: 'Fredoka', sans-serif;
  font-size: 1.5rem;
  line-height: 1.1;
}

.results-stat.score .results-figure { color: var(--mint); }
.results-stat.coins .results-figure { color: #C98B00; }
.results-stat.time  .results-figure { color: var(--grape); }

.results-label {
  font-size: 0.74rem;
  font-weight: 800;
  color: var(--ink-soft);
}

/* --- level bar --- */
.results-levelbox {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 20px;
}

.results-levelrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.results-levelbadge {
  font-family: 'Fredoka', sans-serif;
  font-size: 0.9rem;
  background: var(--grape);
  color: #fff;
  padding: 4px 13px;
  border-radius: 999px;
}

.results-levelbadge.bump { animation: badgeBump 0.5s ease; }

@keyframes badgeBump {
  0%, 100% { transform: scale(1); }
  45% { transform: scale(1.22); }
}

.results-levelnote {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--ink-soft);
}

.results-track {
  height: 16px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--paper);
  overflow: hidden;
}

.results-fill {
  height: 100%;
  width: 0;
  background: var(--gold);
}

.results-fill.glow { box-shadow: 0 0 14px 2px rgba(255, 197, 61, 0.9); }

/* --- buttons --- */
.results-buttons {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.results-again { width: 100%; }

.results-home {
  display: block;
  font-family: 'Fredoka', sans-serif;
  font-size: 0.95rem;
  padding: 9px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  text-decoration: none;
}

/* --- confetti --- */
.confetti-bit {
  position: absolute;
  top: -12px;
  width: 9px;
  height: 9px;
  pointer-events: none;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(420px) rotate(680deg); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .confetti-bit { display: none; }
  .results-stat { opacity: 1; transform: none; }
}

/* ============================================================
   Speed Stages — chunky arcade HUD
   ============================================================ */

.hud { gap: 10px; justify-content: center; }

.pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(#2E4C78, #1B3151);
  border: 3px solid #fff;
  border-radius: 999px;
  padding: 7px 20px 7px 12px;
  font-size: 1.3rem;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
}

.pill b { font-size: 1.15rem; }
.pill.speed  span { color: var(--gold); }
.pill.hearts span { color: #FF8A98; }
.pill.wins   span { color: var(--mint); }
.pill.mult   span { color: #C4AEFF; }

/* left column of square buttons */
.sidebar {
  position: fixed;
  left: 14px;
  top: 96px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 20;
}

.sidebar button {
  width: 86px;
  height: 86px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 0.82rem;
  padding: 0;
  border: 3px solid #fff;
  border-radius: 16px;
  background: linear-gradient(#5AA9E6, #3A7CC4);
  color: #fff;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4);
}

.sidebar button span { font-size: 1.9rem; line-height: 1; }
.sidebar button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4); }
#rebirthBtn { background: linear-gradient(#B88BEA, #8B5FD0); }

/* progress bar along the bottom */
.bottombar {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: min(620px, 92vw);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 16px;
  background: rgba(20, 32, 52, 0.88);
  border: 3px solid #fff;
  border-radius: 999px;
  font-family: 'Fredoka', sans-serif;
  color: #fff;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4);
  z-index: 20;
}

.bb-level { font-size: 1.05rem; white-space: nowrap; }

.bb-track {
  flex: 1;
  height: 17px;
  background: rgba(0, 0, 0, 0.45);
  border-radius: 999px;
  overflow: hidden;
}

.bb-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--gold), #FF9F43);

/* ============================================================
   Mage Run — styled after the reference screenshots
   ============================================================ */
.px, .px-hud, .ms-screen, .end-box { font-family: 'Pixelify Sans', 'Fredoka', monospace; }
canvas#cv { image-rendering: pixelated; }
.banner { font-family: 'Pixelify Sans', monospace; font-weight: 700;
          text-shadow: 3px 0 0 #1A1024, -3px 0 0 #1A1024, 0 3px 0 #1A1024, 0 -3px 0 #1A1024; }

/* ---------- the bar across the top ---------- */
.px-hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none;                           /* shown while playing */
  flex-direction: column; align-items: stretch;
  padding: 1.6vh 2.4vw 2.4vh;
  pointer-events: none; z-index: 20;
  /* a soft shade so a star high up in the level can't sit on top of the
     numbers and look like part of the bar */
  background: linear-gradient(rgba(12, 10, 30, .5), rgba(12, 10, 30, 0));
}
.px-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 2vw; white-space: nowrap; }
@media (max-width: 600px) {
  /* the bar spilled off a phone screen: smaller type, and everything on one line */
  /* .px-hud in front so these beat the full-size rules further down */
  .px-hud .px-level, .px-hud .px-item { font-size: min(4.6vw, 26px); }
  .px-hud .px-item img { height: min(4.6vw, 26px); }
  .px-hud .px-hearts { font-size: min(5.2vw, 28px); }
  .px-hud .px-item .lbl { margin-right: 1vw; }
  .px-hud .pause { width: 38px; height: 38px; border-width: 4px; font-size: 16px; }
  .px-hud .px-row { gap: 2.4vw; }
}
.px-left { display: flex; flex-direction: column; gap: .4vh; }
.px-level { font-size: clamp(22px, 4.6vh, 44px); font-weight: 700; color: #B25CF0; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; line-height: 1; }
.px-hearts { font-size: clamp(22px, 4.8vh, 46px); line-height: 1; letter-spacing: .1em; }
.px-hearts .on  { color: #E8343F; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }
.px-hearts .off { color: #4A2A34; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }
.px-item { display: flex; align-items: center; gap: .6vw; font-size: clamp(22px, 4.6vh, 44px);
           font-weight: 700; line-height: 1; color: #F2A33A; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }
.px-item img { height: clamp(22px, 4.6vh, 44px); image-rendering: pixelated; }
.px-item .lbl { color: #fff; margin-right: .5vw; }
.px-item .slash { color: #fff; }
.pause {
  pointer-events: auto;
  width: clamp(44px, 8vh, 74px); height: clamp(44px, 8vh, 74px);
  display: grid; place-items: center; padding: 0;
  font: 700 clamp(20px, 3.6vh, 34px)/1 'Pixelify Sans', monospace; color: #fff; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024;
  background: #3F7BC2; border: 6px solid #8E4B37; border-radius: 0;
  box-shadow: 0 0 0 3px #2A1716, inset 0 0 0 3px #2A1716;
}
.px-btns { display: flex; gap: 8px; }
.pause#muteBtn { font-size: clamp(16px, 3vh, 28px); }
.bossbar { align-self: center; margin-top: 1vh; width: min(460px, 60vw); height: 18px;
           border: 3px solid #1A1024; background: #3A2233; box-shadow: 0 0 0 3px #fff; }
.bossbar i { display: block; height: 100%; background: linear-gradient(#FF7A5C, #D63C3C); }

/* ---------- world / level picker (the landscape is the canvas behind) ---------- */
.ms-screen {
  --c: min(108px, 12.5vh, 13vw);
  position: fixed; inset: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 2.5vh 16px 2vh;
  background: transparent;
  z-index: 40; overflow: auto;
}
.ms-top { width: 100%; max-width: 1040px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
.ms-back {
  justify-self: start;
  width: clamp(42px, min(10vh, 12vw), 92px); height: clamp(42px, min(10vh, 12vw), 92px);
  display: grid; place-items: center; text-decoration: none;
  font: 700 clamp(26px, 5vh, 46px)/1 'Pixelify Sans', monospace; color: #fff; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024;
  background: #3F7BC2; border: 7px solid #8E4B37;
  box-shadow: 0 0 0 3px #2A1716, inset 0 0 0 3px #2A1716;
}
.ms-title { text-align: center; white-space: nowrap; font-size: clamp(26px, min(7.5vh, 9vw), 72px); font-weight: 700; color: #1A1024;
            text-shadow: 2px 0 0 #FFFFFF,-2px 0 0 #FFFFFF,0 2px 0 #FFFFFF,0 -2px 0 #FFFFFF,2px 2px 0 #FFFFFF,-2px 2px 0 #FFFFFF,2px -2px 0 #FFFFFF,-2px -2px 0 #FFFFFF, 0 6px 0 rgba(0,0,0,.25); line-height: 1; }
.ms-title small { display: block; margin-top: .6vh; font-size: .36em; color: #fff; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }
.ms-points { justify-self: end; text-align: right; font-size: clamp(13px, min(3.8vh, 4vw), 36px); font-weight: 700; color: #fff; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }
.ms-points b { color: #F2A33A; margin-left: .4em; }
@media (max-width: 560px) { .ms-points b { display: block; margin: 0; } }

.ms-body { display: flex; align-items: center; gap: 3vw; margin-top: 3vh; }
.ms-arrow { width: clamp(40px, 8vh, 76px); padding: 0; background: none; border: none; box-shadow: none; cursor: pointer; }
.ms-arrow svg { width: 100%; display: block; }
.ms-arrow.left svg { transform: scaleX(-1); }
.ms-middle { display: flex; flex-direction: column; align-items: center; gap: 2.6vh; }
.ms-grid { display: grid; grid-template-columns: repeat(5, calc(var(--c) * 1.22)); gap: 2.4vh 1.6vw; justify-content: center; }
@media (max-aspect-ratio: 1/1) { .ms-grid { grid-template-columns: repeat(3, calc(var(--c) * 1.22)); } }

.cell { display: flex; flex-direction: column; align-items: center; gap: .9vh;
        padding: 0; background: none; border: none; box-shadow: none; cursor: pointer; }
.crate {
  position: relative; width: var(--c); height: var(--c);
  display: grid; place-items: center;
  background: #5E6C77;
  border: calc(var(--c) * .1) solid #8E4B37;
  box-shadow: 0 0 0 3px #2A1716, inset 0 0 0 3px #2A1716, 0 7px 0 2px rgba(0,0,0,.28);
}
.isboss .crate { background: #6E3A45; }
.cell:not(.locked):hover .crate  { transform: translateY(-3px); }
.cell:not(.locked):active .crate { transform: translateY(3px); }
.cell.locked { cursor: not-allowed; }
.rv { position: absolute; width: calc(var(--c) * .13); height: calc(var(--c) * .13);
      background: #909AB2; box-shadow: 0 0 0 2px #2F3344, inset -2px -2px 0 #5F6880; }
.rv.a { left: calc(var(--c) * -.115); top: calc(var(--c) * -.115); }
.rv.b { right: calc(var(--c) * -.115); top: calc(var(--c) * -.115); }
.rv.c { left: calc(var(--c) * -.115); bottom: calc(var(--c) * -.115); }
.rv.d { right: calc(var(--c) * -.115); bottom: calc(var(--c) * -.115); }
.num { font-size: calc(var(--c) * .52); font-weight: 700; line-height: 1; color: #6FE04A; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }
.skull { width: calc(var(--c) * .62); image-rendering: pixelated; }
.lock { position: relative; width: calc(var(--c) * .44); height: calc(var(--c) * .34);
        margin-top: calc(var(--c) * .16); background: #0E0A12; }
.lock::before { content: ''; position: absolute; left: calc(var(--c) * .07); top: calc(var(--c) * -.22);
        width: calc(var(--c) * .16); height: calc(var(--c) * .2);
        border: calc(var(--c) * .07) solid #0E0A12; border-bottom: none;
        border-radius: calc(var(--c) * .12) calc(var(--c) * .12) 0 0; }
.lock::after { content: ''; position: absolute; left: 44%; top: 30%; width: 12%; height: 42%; background: #5E6C77; }
.lvstars { display: flex; gap: 2px; }
.lvstars img { width: calc(var(--c) * .27); image-rendering: pixelated; }
.lvstars img.mid, .end-stars img.mid { transform: translateY(18%); }
.ms-help { margin-top: 2.4vh; text-align: center; color: #fff; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; font-size: clamp(12px, 2vh, 17px); line-height: 1.5; }

/* ---------- "new monster!" card ---------- */
.intro {
  position: fixed; left: 50%; top: 17vh; transform: translateX(-50%);
  display: none; align-items: center; gap: 16px;
  padding: 12px 20px 12px 14px; max-width: min(560px, 92vw);
  background: #3D4F63; border: 6px solid #8E4B37;

.intro img { width: 72px; image-rendering: pixelated; flex: none; }

.intro .it { font-size: 1rem; margin-top: 3px; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }

/* ---------- end of level ---------- */

                padding: 20px; background: rgba(8,10,24,.6); z-index: 55; }
.end-box {

.end-stars { display: flex; justify-content: center; gap: 6px; }
.end-stars img { width: 78px; image-rendering: pixelated; }
.end-score { margin: 16px 0 14px; font-size: 1.6rem; font-weight: 700; color: #F2A33A; text-shadow: 2px 0 0 #1A1024,-2px 0 0 #1A1024,0 2px 0 #1A1024,0 -2px 0 #1A1024,2px 2px 0 #1A1024,-2px 2px 0 #1A1024,2px -2px 0 #1A1024,-2px -2px 0 #1A1024; }

/* ---------- on-screen controls ---------- */
.touchpad { display: none; }
@media (pointer: coarse) {

<script>
const Save = (() => {
  const KEY = 'mathcade';

  const BLANK = {
    name: 'Player',
    coins: 0,     // coins you can spend
    xp: 0,        // every coin ever earned. Spending can't take this away,
                  // which is why the overall level uses it and not coins.
    level: 1,     // which MATHS level you're on (1-8) — not the overall level
    streak: 0,    // correct answers in a row right now
    best: 0       // best streak ever
  };

  let data = load();
  const listeners = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { ...BLANK };
      const saved = JSON.parse(raw);
      // Anyone who played before the overall level existed: their coins are
      // the only record of what they earned, so start their XP from those.
      if (saved.xp === undefined) saved.xp = saved.coins || 0;
      return { ...BLANK, ...saved };
    } catch (e) {
      // Private browsing, or storage full — play on without saving.
      return { ...BLANK };
    }
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      /* nothing we can do; the game still works for this session */
    }
    listeners.forEach(fn => fn(data));

    // --- FIREBASE GOES HERE (later) -------------------------
    // if (firebase.auth().currentUser) {
    //   firebase.database()
    //     .ref('players/' + firebase.auth().currentUser.uid)
    //     .set(data);
    // }
    // --------------------------------------------------------
  }

  return {
    get: () => ({ ...data }),

    update(changes) {
      data = { ...data, ...changes };
      persist();
      return { ...data };
    },

    addCoins(n) {
      data.coins += n;
      data.xp    += n;      // the overall level rides along on every coin,
      persist();            // so no game has to know the level exists
      return data.coins;
    },

    // Every game except Prism Rush pays in XP only. Coins are Prism Rush's
    // own money (for skins), so answering questions elsewhere shouldn't
    // quietly fill a wallet you can only spend in one game.
    addXp(n) {
      data.xp += n;
      persist();
      return data.xp;
    },

    spendCoins(n) {
      if (data.coins < n) return false;
      data.coins -= n;      // xp deliberately untouched
      persist();
      return true;
    },

    // One level across every game, worked out from XP.
    // Level 2 needs 100 XP, then 250, 450, 700, 1000 ... each step 50 more.
    // There's no top level; it just keeps getting slower.
    overall() {
      const xp   = data.xp;
      const need = n => 25 * n * n + 75 * n;     // XP to reach level n + 1
      const n    = Math.floor((-75 + Math.sqrt(5625 + 100 * xp)) / 50);
      const from = need(n);
      const to   = need(n + 1);
      return {
        level: n + 1,
        xp,
        into: xp - from,      // XP earned since this level began
        span: to - from,      // how much XP this level is worth
        next: to - xp         // XP still to go
      };
    },

    // Run a function now and again every time anything changes.
    onChange(fn) {
      listeners.push(fn);
      fn(data);
    },

    reset() {
      data = { ...BLANK };
      persist();
    }
  };
})();

const MathEngine = (() => {

  // --- little helpers -------------------------------------------------
  const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = arr => arr[rnd(0, arr.length - 1)];

  // --- the question ladder --------------------------------------------
  // Each level is a function that returns { text, answer }.
  const LEVELS = [
    // Made a bit easier on request (twice): same eight steps, gentler numbers.
    // Each step leans on the friendly cases (2, 5 and 10 times tables,
    // halves and quarters, 10% / 25% / 50%) and only sometimes mixes in
    // the harder ones, so a level still stretches you without being a wall.

    // 1 — adding and taking away, small numbers
    () => {
      const a = rnd(1, 10), b = rnd(1, 10);
      return Math.random() < 0.5
        ? { text: `${a} + ${b}`, answer: a + b }
        : { text: `${a + b} − ${b}`, answer: a };
    },

    // 2 — adding and taking away, two-digit numbers.
    // Mostly ones with no carrying (23 + 14), and about 1 in 5 that needs it
    // (38 + 27). Carrying is the skill this step teaches, so it stays in -
    // just not every time. Subtraction is the same: (a + b) − b needs
    // borrowing exactly when a + b would have needed carrying.
    () => {
      const carry = Math.random() < 0.2;
      let a, b;
      do { a = rnd(10, 50); b = rnd(5, 30); }
      while (((a % 10) + (b % 10) >= 10) !== carry);
      return Math.random() < 0.5
        ? { text: `${a} + ${b}`, answer: a + b }
        : { text: `${a + b} − ${b}`, answer: a };
    },

    // 3 — times tables, mostly the friendly ones
    () => {
      const a = Math.random() < 0.8 ? pick([2, 3, 4, 5, 10]) : rnd(2, 9);
      const b = rnd(1, 10);
      return { text: `${a} × ${b}`, answer: a * b };
    },

    // 4 — division facts, mostly the friendly ones
    () => {
      const b = Math.random() < 0.8 ? pick([2, 3, 4, 5, 10]) : rnd(2, 9);
      const answer = rnd(1, 10);
      return { text: `${b * answer} ÷ ${b}`, answer };
    },

    // 5 — two steps, order of operations
    () => {
      const a = rnd(2, 4), b = rnd(2, 5), c = rnd(1, 10);
      return Math.random() < 0.5
        ? { text: `${a} × ${b} + ${c}`, answer: a * b + c }
        : { text: `${a * b + c} − ${a} × ${b}`, answer: c };
    },

    // 6 — fractions of an amount, mostly one-halves, quarters and tenths
    () => {
      const denom = pick([2, 2, 4, 5, 10]);
      const numer = Math.random() < 0.8 ? 1 : rnd(1, denom - 1);
      const whole = denom * rnd(2, 10);
      return {
        text: `${numer}/${denom} of ${whole}`,
        answer: (whole / denom) * numer
      };
    },

    // 7 — percentages, mostly 10%, 25% and 50% of round numbers
    () => {
      const pct = Math.random() < 0.8 ? pick([10, 25, 50]) : pick([20, 75]);
      const whole = pick([20, 40, 60, 80, 100]);
      return { text: `${pct}% of ${whole}`, answer: (whole * pct) / 100 };
    },

    // 8 — solve for x
    () => {
      const a = rnd(2, 4), x = rnd(1, 10), b = rnd(1, 10);
      return { text: `${a}x + ${b} = ${a * x + b},  x = ?`, answer: x };
    }
  ];

  const MAX_LEVEL = LEVELS.length;
  const STREAK_TO_LEVEL_UP = 3;

  // Coins a single question is worth, before the run multiplier.
  const baseReward = level => 5 + level * 3;

  // --- a run of questions ---------------------------------------------
  function startRun(length = 5, { coins = false } = {}) {
    let index = 0;          // how far through the run
    let question = null;

    // The difficulty is fixed the moment the run starts. Before this, every
    // question looked up your level again — so you could deliberately get a
    // hard one wrong, drop a level, and have the whole restarted run be easy.
    // Getting one wrong still costs you a level for NEXT time; it just can't
    // make the run you are in any easier.
    const runLevel = Save.get().level;

    function make() {
      const level = runLevel;
      const q = LEVELS[level - 1]();
      question = {
        text: q.text,
        answer: q.answer,
        level,
        number: index + 1,
        of: length,
        reward: baseReward(level)
      };
      return question;
    }

    return {
      current() {
        return question || make();
      },

      submit(given) {
        const q = question || make();
        const correct = Number(given) === q.answer;
        const save = Save.get();

        if (correct) {
          index++;
          const streak = save.streak + 1;
          let level = save.level;
          let levelUp = false;

          if (streak % STREAK_TO_LEVEL_UP === 0 && level < MAX_LEVEL) {
            level++;
            levelUp = true;
          }

          Save.update({ streak, level, best: Math.max(save.best, streak) });
          if (coins) Save.addCoins(q.reward);   // Prism Rush only
          else       Save.addXp(q.reward);

          const finished = index >= length;
          if (!finished) make();

          return {
            correct: true,
            reward: q.reward,
            streak,
            level,
            levelUp,
            finished,
            answer: q.answer
          };
        }

        // Wrong — the run restarts from question 1 and the level eases off.
        index = 0;
        const level = Math.max(1, save.level - 1);
        Save.update({ streak: 0, level });
        make();

        return {
          correct: false,
          reward: 0,
          streak: 0,
          level,
          levelDown: level < save.level,
          restarted: true,
          finished: false,
          answer: q.answer
        };
      },

      progress() {
        return { done: index, total: length };
      }
    };
  }

  // A one-off question with no run attached.
  function single() {
    return startRun(1);
  }

  return { startRun, single, MAX_LEVEL };
})();

const Quiz = (() => {
  let root = null;
  let active = false;

  function build() {
    root = document.createElement('div');
    root.className = 'quiz-backdrop';
    root.innerHTML = `
      <div class="quiz-card" role="dialog" aria-modal="true">
        <p class="quiz-title"></p>
        <p class="quiz-subtitle"></p>
        <div class="quiz-pips"></div>
        <p class="quiz-prompt"></p>
        <div class="answer-row">
          <input type="number" class="quiz-input" inputmode="numeric"
                 aria-label="Your answer" autocomplete="off">
          <button class="quiz-check">Unlock</button>
        </div>
        <p class="feedback quiz-feedback"></p>
      </div>`;
    document.body.appendChild(root);
  }

  function ask({ count = 2, title = 'Locked', subtitle = '', onDone, coins = false }) {
    if (active) return;
    if (!root) build();
    active = true;

    const card     = root.querySelector('.quiz-card');
    const pipsEl   = root.querySelector('.quiz-pips');
    const promptEl = root.querySelector('.quiz-prompt');
    const inputEl  = root.querySelector('.quiz-input');
    const btnEl    = root.querySelector('.quiz-check');
    const fbEl     = root.querySelector('.quiz-feedback');

    root.querySelector('.quiz-title').textContent = title;
    root.querySelector('.quiz-subtitle').textContent = subtitle;

    const run = MathEngine.startRun(count, { coins });
    let earned = 0;
    let asked = 0;
    let right = 0;

    function draw() {
      const q = run.current();
      const { done } = run.progress();
      promptEl.textContent = q.text;
      pipsEl.innerHTML = Array.from({ length: count }, (_, i) =>
        `<span class="pip ${i < done ? 'lit' : ''}"></span>`).join('');
      inputEl.value = '';
      inputEl.focus();
    }

    function submit() {
      if (inputEl.value === '') return;
      const res = run.submit(inputEl.value);
      asked++;
      if (res.correct) right++;

      if (res.correct) {
        earned += res.reward;
        if (res.finished) {
          fbEl.className = 'feedback quiz-feedback good';
          fbEl.textContent = `Unlocked. +${earned} ${coins ? 'coins' : 'XP'}.`;
          setTimeout(close, 700);
          return;
        }
        fbEl.className = 'feedback quiz-feedback good';
        fbEl.textContent = res.levelUp
          ? `Correct — maths level ${res.level} now.`
          : 'Correct. Next one.';
      } else {
        earned = 0;
        fbEl.className = 'feedback quiz-feedback bad';
        fbEl.textContent = `It was ${res.answer}. Back to the first question.`;
        card.classList.remove('shake');
        void card.offsetWidth;          // restart the animation
        card.classList.add('shake');
      }
      draw();
    }

    function close() {
      active = false;
      root.classList.remove('open');
      btnEl.removeEventListener('click', submit);
      inputEl.removeEventListener('keydown', onKey);
      if (onDone) onDone(earned, { asked, correct: right });
    }

    function onKey(e) {
      e.stopPropagation();              // don't let the game read this keypress
      if (e.key === 'Enter') submit();
    }

    btnEl.addEventListener('click', submit);
    inputEl.addEventListener('keydown', onKey);

    fbEl.textContent = '';
    fbEl.className = 'feedback quiz-feedback';
    root.classList.add('open');
    draw();
  }

  return { ask, isOpen: () => active };
})();
</script>
<script>
/* ==========================================================
   MAGE RUN

   Two worlds of ten levels. Every tenth level is a boss, and
   every level in a world shares that world's background.

   Run right, collect magic, blast the creatures, grab the
   three stars, reach the doorway. Three questions when you
   finish — dying never costs you a question.

   y is measured from the top of the grass and goes NEGATIVE
   upwards, so a ledge at y:-140 floats 140px above it.
   ========================================================== */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

const RUN = 300, ACCEL = 2400, FRICTION = 2000;
const GRAVITY = 2100, JUMP = 760, JUMP2 = 660;
const COYOTE = 0.10, BUFFER = 0.12;
const PW = 30, PH = 44, PIT = 300;

const MAX_MAGIC = 9, BOLT_SPEED = 560, BOLT_LIFE = 1.0, RELOAD = 0.22;
const BOSS_HP = 6;


/* ==========================================================
   SOUND — everything is made by the browser from code, no
   sound files, so it still works offline.

   Sound.sfx('jump')       a sound effect
   Sound.play('fields')    start a song (does nothing if it's already on)
   Sound.stop()            stop the music
   Sound.toggle()          mute / unmute, remembered next time
   ========================================================== */
const Sound = (() => {
  let ac = null, master, music, fx, echo;
  let muted = !!Save.get().mrMuted;
  let song = null, step = 0, next = 0, timer = null, duck = 1;

  // Browsers only allow sound after the player has pressed something,
  // so the audio is switched on by the first key, click or tap.
  function wake() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 1;
      master.connect(ac.destination);
      music = ac.createGain(); music.gain.value = 0.55; music.connect(master);
      fx = ac.createGain(); fx.gain.value = 0.8; fx.connect(master);
      // a soft echo, used by the cave song
      echo = ac.createDelay(); echo.delayTime.value = 0.32;
      const back = ac.createGain(); back.gain.value = 0.35;
      echo.connect(back); back.connect(echo); back.connect(music);
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  }
  ['keydown', 'pointerdown', 'touchstart'].forEach(ev =>
    addEventListener(ev, () => { wake(); if (song && !timer) start(); }, { passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });

  const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);

  function tone(freq, dur, type, vol, slide, when, dest) {
    const t = (ac.currentTime) + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || fx);
    o.start(t); o.stop(t + dur + 0.03);
  }

  let noiseBuf = null;
  function noise(dur, vol, cutoff, when, dest) {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + (when || 0);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = 'lowpass'; f.frequency.value = cutoff || 2000;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || fx);
    src.start(t); src.stop(t + dur + 0.02);
  }

  const arp = (base, steps, gap, type, vol) =>
    steps.forEach((s, i) => tone(base * Math.pow(2, s / 12), 0.13, type, vol, 0, i * gap));

  const EFFECTS = {
    jump:       () => tone(380, 0.13, 'square', 0.09, 1.9),
    jump2:      () => tone(560, 0.15, 'square', 0.09, 2.0),
    fire:       () => { tone(1300, 0.10, 'sawtooth', 0.05, 0.35); tone(700, 0.08, 'sine', 0.06, 0.5); },
    empty:      () => tone(140, 0.12, 'square', 0.07, 0.8),
    hit:        () => { noise(0.07, 0.22, 2400); tone(240, 0.08, 'square', 0.07, 0.6); },
    kill:       () => { noise(0.2, 0.28, 1400); tone(420, 0.09, 'square', 0.09, 0.45); tone(210, 0.16, 'square', 0.07, 0.5, 0.06); },

let cpX = 0, cpHit = false;          // the halfway checkpoint

let player = { x: 60, y: -PH, vx: 0, vy: 0, onGround: false, jumps: 0, face: 1, walk: 0 };
let hearts = 3, mana = 3, starsGot = 0, points = 0, zapped = 0;
let coyote = 0, buffer = 0, hurt = 0, drop = 0, shake = 0, reload = 0;
let safeX = 60, running = false, finished = false, time = 0;

const held = { left: false, right: false, down: false, jump: false, fire: false };

function seeded(n) {
  let s = n * 9301 + 49297;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

/* ---------- progress ---------- */
const starsFor = (w, l) => (Save.get().mrStars || {})[key(w, l)];
const isDone   = (w, l) => starsFor(w, l) !== undefined;
function isOpen(w, l) {
  if (w === 0 && l === 0) return true;
  return l === 0 ? isDone(w - 1, PER_WORLD - 1) : isDone(w, l - 1);
}
const totalPoints = () => Save.get().mrPoints || 0;

/* ---------- build a level ---------- */
function loadLevel(w, l) {
  wIdx = w; lIdx = l;
  TH = WORLDS[w];
  L  = TH.levels[l];

  ground = L.ground.map(([x, gw]) => ({ x, y: 0, w: gw, h: 420 }));
  plats  = L.plats.map(([x, y, pw]) => ({ x, y, w: pw, h: 18 }));
  magic  = L.magic.map(([x, y]) => ({ x, y, got: false, t: Math.random() * 6 }));
  stars  = L.stars.map(([x, y]) => ({ x, y, got: false }));
  spikes = L.spikes.map(([x, sw]) => ({ x, w: sw }));
  foes   = L.foes.map(([a, b2, y, kind]) => {
    const spec = kind === 'boss' ? BOSS[L.bossKind || 'skullking'] : FOE[kind];
    return {
      a, b: b2, y, kind, spec,
      x: kind === 'spitter' || kind === 'turret' ? (a + b2) / 2 : a,
      up: false, rise: 0, stage: 'down', shield: 0,
      dir: 1, alive: true, t: Math.random() * 6, flash: 0,
      hp: spec.hp, maxHp: spec.hp, w: spec.w, h: spec.h,
      jy: 0, jv: 0, cool: 1 + Math.random(), charge: 0,
      gy: kind === 'boss' ? -spec.h : y            // where a floating one hovers
    };
  });
  bolts = []; bits = []; shots = [];

  const rnd = seeded(w * 31 + l + 7);
  decor = [];
  ground.forEach(g => {
    for (let k = 0; k < Math.floor(g.w / 150); k++) {
      const x = g.x + 50 + rnd() * (g.w - 100);
      const r = rnd();
      decor.push({ x, kind: r < 0.36 ? 'rock' : r < 0.66 ? 'bush' : 'tuft', s: 0.75 + rnd() * 0.6 });
    }
  });

  // Checkpoint: the start of the stretch of ground nearest halfway. The first
  // part of every stretch is a landing zone the level builder keeps clear of
  // spikes and monsters, so you can never be put back somewhere dangerous.
  cpHit = false; cpX = 0;
  if (!L.boss && L.ground.length > 2) {
    const half = L.goal / 2;
    const seg = L.ground.slice(1).reduce((best, g) =>
      Math.abs(g[0] - half) < Math.abs(best[0] - half) ? g : best);
    cpX = seg[0] + 70;
  }

  hearts = 3; mana = 3; starsGot = 0; points = 0; zapped = 0;
  finished = false; safeX = 60;
  respawn();
  running = true;
  updateHud();
}

function respawn() {
  player.x = safeX; player.y = -PH - 4;
  player.vx = 0; player.vy = 0; player.jumps = 0;
  hurt = 0.9;
}

/* ---------- collision ---------- */
const hits = (ax, ay, aw, ah, bx, by, bw, bh) =>
  ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function moveAndCollide(dt) {
  player.x += player.vx * dt;
  for (const bk of ground) {
    if (!hits(player.x, player.y, PW, PH, bk.x, bk.y, bk.w, bk.h)) continue;
    if (player.vx > 0) player.x = bk.x - PW;
    else if (player.vx < 0) player.x = bk.x + bk.w;
    player.vx = 0;
  }
  if (player.x < 0) { player.x = 0; player.vx = 0; }

  const prevBottom = player.y + PH;
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  player.onGround = false;

  for (const bk of ground) {
    if (!hits(player.x, player.y, PW, PH, bk.x, bk.y, bk.w, bk.h)) continue;
    if (player.vy > 0) land(bk);
    else if (player.vy < 0) { player.y = bk.y + bk.h; player.vy = 0; }
  }
  if (drop <= 0) {
    for (const bk of plats) {
      if (player.vy <= 0) continue;
      if (prevBottom > bk.y + 2) continue;
      if (!hits(player.x, player.y, PW, PH, bk.x, bk.y, bk.w, bk.h)) continue;
      land(bk);
    }
  }
}

function land(bk) {
  const falling = player.vy;
  player.y = bk.y - PH; player.vy = 0;
  if (!player.onGround && falling > 500) puff(player.x + PW / 2, bk.y, 5);
  player.onGround = true; player.jumps = 0;
}

/* ---------- shooting ---------- */
function fire() {
  if (reload > 0) return;
  if (mana < 1) { flash('No magic left — find more'); Sound.sfx('empty'); reload = 0.4; return; }
  mana--; reload = RELOAD;
  Sound.sfx('fire');
  bolts.push({
    x: player.x + PW / 2 + player.face * 14,
    y: player.y + 26,                 // mid-body, low enough to actually hit a slime
    vx: player.face * BOLT_SPEED,
    life: BOLT_LIFE
  });
  updateHud();
}

// the top edge of a creature's box, in world y
function foeTop(f) {
  if (f.kind === 'boss')  return f.spec.fly ? f.gy : -f.h;
  if (f.kind === 'bat')   return f.y + Math.sin(f.t * 2.2) * 16;
  if (f.kind === 'ghost') return f.gy;
  if (f.kind === 'bird')  return f.y;
  if (f.kind === 'worm')  return -f.h * f.rise;    // pokes up out of the ground
  return -f.h + f.jy;                              // on the ground (hoppers leave it)
}

/* ---------- one tick ---------- */
function step(dt) {
  if (!running || finished || paused || Quiz.isOpen()) return;
  time += dt;
  if (hurt > 0) hurt -= dt;
  if (drop > 0) drop -= dt;
  if (shake > 0) shake -= dt;
  if (reload > 0) reload -= dt;

  const want = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (want !== 0) {
    player.vx = Math.max(-RUN, Math.min(RUN, player.vx + want * ACCEL * dt));
    player.face = want;
  } else {
    const d = FRICTION * dt;
    player.vx = player.vx > 0 ? Math.max(0, player.vx - d) : Math.min(0, player.vx + d);
  }

  coyote = player.onGround ? COYOTE : Math.max(0, coyote - dt);
  buffer = Math.max(0, buffer - dt);
  if (buffer > 0) {
    if (held.down && player.onGround && onLedge()) { drop = 0.18; buffer = 0; }
    else if (coyote > 0 || player.onGround) {
      player.vy = -JUMP; player.jumps = 1; buffer = 0; coyote = 0;
      Sound.sfx('jump');
      puff(player.x + PW / 2, player.y + PH, 3);
    } else if (player.jumps === 1) {
      player.vy = -JUMP2; player.jumps = 2; buffer = 0;
      Sound.sfx('jump2');
      ring(player.x + PW / 2, player.y + PH / 2);
    }
  }
  if (held.fire) fire();

  moveAndCollide(dt);

  player.walk += Math.abs(player.vx) * dt;
  if (player.onGround && Math.abs(player.vx) > 120 && Math.random() < dt * 14)
    puff(player.x + PW / 2 - player.face * 8, player.y + PH, 1);

  foes.forEach(f => { if (f.alive) think(f, dt); });

  // fireballs, rocks and ice. Each one is fenced in to its creature's own
  // patch of ground, so nothing flies out over a pit at you mid-jump.
  shots = shots.filter(sh => {
    sh.life -= dt;
    sh.vy += sh.g * dt;
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    if (sh.life <= 0 || sh.x < sh.a || sh.x > sh.b || sh.y > 0) return false;
    if (hurt <= 0 && hits(player.x, player.y, PW, PH, sh.x - 4, sh.y - 4, 8, 8)) {
      damage(sh.kind === 'rock' ? 'A rock landed on you' : sh.kind === 'ice' ? 'Hit by ice' : 'Fireball!');
      return false;
    }
    return true;
  });

  bolts = bolts.filter(bo => {
    bo.life -= dt;
    bo.x += bo.vx * dt;
    if (bo.life <= 0) return false;
    if (ground.some(bk => hits(bo.x - 6, bo.y - 6, 12, 12, bk.x, bk.y, bk.w, bk.h))) {
      for (let i = 0; i < 4; i++) sparkle(bo.x, bo.y, '#E8A6FF');
      return false;
    }
    // you can shoot their fireballs and ice out of the air
    const si = shots.findIndex(sh => hits(bo.x - 6, bo.y - 6, 12, 12, sh.x - 6, sh.y - 6, 12, 12));
    if (si >= 0) {
      for (let i = 0; i < 6; i++) sparkle(shots[si].x, shots[si].y, '#FFD9A0');
      shots.splice(si, 1);
      Sound.sfx('pop');
      points += 5;
      return false;
    }
    const f = foes.find(fo => fo.alive && canBeHit(fo) &&
      hits(bo.x - 6, bo.y - 6, 12, 12, fo.x, foeTop(fo), fo.w, fo.h));
    if (f && blocks(f, bo)) {
      // clink: a shield, or the Guardian's barrier
      for (let i = 0; i < 6; i++) sparkle(bo.x, bo.y, '#D8FFFA');
      Sound.sfx('clink');
      return false;
    }
    if (f) {
      f.hp--; f.flash = 0.16;
      Sound.sfx(f.kind === 'boss' ? (f.hp <= 0 ? 'bossDown' : 'bossHit') : (f.hp <= 0 ? 'kill' : 'hit'));
      for (let i = 0; i < 8; i++) sparkle(f.x + f.w / 2, foeTop(f) + 8, '#FFC7A0');
      if (f.hp <= 0) {
        f.alive = false;
        zapped++; points += f.kind === 'boss' ? 300 : f.spec.pts;
        // every creature drops a crystal, so the tough ones pay for themselves
        magic.push({ x: f.x + f.w / 2, y: -28, got: false, t: 0, drop: true });
        if (f.kind === 'boss') { flash('The way is open!'); shake = 0.5; }
        for (let i = 0; i < 16; i++) sparkle(f.x + f.w / 2, foeTop(f) + 8, '#FFE79A');
      } else if (f.kind === 'boss') {
        flash('Boss: ' + f.hp + ' hits left');
      }
      updateHud();
      return false;
    }
    return true;
  });

  magic.forEach(m => {
    // In a boss arena the orbs come back. Without this you could spend all
    // the magic, and with the boss still standing the door never opens.
    if (m.got && L.boss && time > m.back) m.got = false;
    if (m.got) return;
    m.t += dt * 4;
    if (near(m.x, m.y, 30)) {
      m.got = true; m.back = time + 5;
      Sound.sfx('crystal'); mana = Math.min(MAX_MAGIC, mana + 1); points += 5;
      sparkle(m.x, m.y, '#C9A6FF'); updateHud();
    }
  });
  stars.forEach(s => {
    if (s.got) return;
    if (near(s.x, s.y, 36)) {
      s.got = true; starsGot++; points += 50;
      Sound.sfx('star');
      for (let i = 0; i < 14; i++) sparkle(s.x, s.y, '#FFE79A');
      flash('Star!'); updateHud();
    }
  });

  if (hurt <= 0 && spikes.some(s => player.x + PW > s.x && player.x < s.x + s.w && player.y + PH > -18))
    damage('Ouch — spikes');
  if (player.y > PIT) damage('Down the gap');

  if (player.onGround && player.y + PH <= 1 && hurt <= 0) {
    const safe = L.ground.some(([x, gw]) =>
      player.x + PW / 2 > x + 20 && player.x + PW / 2 < x + gw - 20);
    if (safe) safeX = Math.round(player.x);
  }

  bits = bits.filter(p => {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    return p.life > 0;
  });

  if (cpX && !cpHit && player.x > cpX && player.onGround) {
    cpHit = true;
    Sound.sfx('checkpoint');
    for (let i = 0; i < 14; i++) sparkle(cpX + 6, -60, '#FFE79A');
    flash('Checkpoint!');
  }

  if (!finished && player.x + PW / 2 > L.goal && doorOpen()) finish();
}

/* ---------- how each creature behaves ---------- */
function patrol(f, speed, dt) {
  f.x += f.dir * speed * dt;
  if (f.x < f.a) { f.x = f.a; f.dir = 1; }
  if (f.x > f.b) { f.x = f.b; f.dir = -1; }
}
const pcx = () => player.x + PW / 2;
const pcy = () => player.y + PH / 2;

function shoot(f, vx, vy, kind, g, y) {
  if (Math.abs(f.x - player.x) < 520) Sound.sfx('enemyShot');   // only the ones near you
  shots.push({
    x: f.x + f.w / 2, y: y === undefined ? foeTop(f) + f.h * 0.45 : y,
    vx, vy, g: g || 0, kind, life: 3,
    a: f.kind === 'boss' ? 20 : f.a - 20,          // the fence
    b: f.kind === 'boss' ? 2180 : f.b + f.w + 20
  });
}

// a Burrower underground can't be hit; your shot passes over it
const canBeHit = f => f.kind !== 'worm' || f.rise > 0.5;

// shots that bounce off instead of hurting
function blocks(f, bo) {
  if (f.kind === 'shielder') return Math.sign(bo.vx) === -f.dir;   // hit its shield side
  if (f.kind === 'boss' && L.bossKind === 'guardian') return f.shield > 0;
  return false;
}

function think(f, dt) {
  f.t += dt; f.cool -= dt;
  if (f.flash > 0) f.flash -= dt;
  const s = f.spec, dx = pcx() - (f.x + f.w / 2);

  switch (f.kind) {
    case 'hopper':
      patrol(f, s.speed, dt);
      if (f.jy === 0 && f.cool <= 0) { f.jv = -430; f.cool = 1.3 + Math.random() * 0.5; }
      if (f.jv !== 0 || f.jy < 0) {
        f.jv += 1500 * dt; f.jy += f.jv * dt;
        if (f.jy >= 0) { f.jy = 0; f.jv = 0; }
      }
      break;

    case 'charger': {
      // spots you in front of it, then charges until it hits the end of its patch
      const sees = Math.sign(dx) === f.dir && Math.abs(dx) < 280 && player.y + PH > -60;
      if (f.charge <= 0 && f.cool <= 0 && sees) f.charge = 1.1;
      if (f.charge > 0) {
        const was = f.dir;
        f.charge -= dt;
        patrol(f, 230, dt);
        if (f.dir !== was || f.charge <= 0) { f.charge = 0; f.cool = 1.2; }
      } else {
        patrol(f, f.cool > 0.6 ? 0 : s.speed, dt);   // gets its breath back first
      }
      break;
    }

    case 'spitter':
      f.dir = dx >= 0 ? 1 : -1;
      if (f.cool <= 0 && Math.abs(dx) < 380 && Math.abs(pcy() - (foeTop(f) + f.h / 2)) < 110) {
        shoot(f, f.dir * 200, 0, 'fire');
        f.cool = 2.2;
      }
      break;

    case 'ghost': {
      // drifts after you, through everything, but never leaves its patch
      const tx = Math.max(f.a, Math.min(f.b, pcx() - f.w / 2));
      f.x += Math.sign(tx - f.x) * Math.min(Math.abs(tx - f.x), s.speed * dt);
      const ty = Math.max(-230, Math.min(-f.h, pcy() - f.h / 2));
      f.gy += Math.sign(ty - f.gy) * Math.min(Math.abs(ty - f.gy), 40 * dt);
      f.dir = dx >= 0 ? 1 : -1;
      break;
    }

    case 'bird':
      patrol(f, s.speed, dt);
      if (f.cool <= 0 && Math.abs(dx) < 16 && pcy() > f.y) {
        shoot(f, 0, 0, 'rock', 900);
        f.cool = 1.6;
      }
      break;

    case 'worm':
      // down -> rumble (a warning) -> up -> down again, somewhere new
      if (f.cool <= 0) {
        if (f.stage === 'down') {
          f.x = f.a + Math.random() * Math.max(0, f.b - f.a);
          f.stage = 'warn'; f.cool = 0.7;
        } else if (f.stage === 'warn') {
          f.stage = 'up'; f.cool = 1.4;
        } else {
          f.stage = 'down'; f.cool = 1.4 + Math.random() * 0.8;
        }
      }
      if (f.stage === 'warn' && Math.random() < dt * 20) puff(f.x + f.w / 2, 0, 1);
      f.rise = f.stage === 'up' ? Math.min(1, f.rise + dt * 5) : Math.max(0, f.rise - dt * 5);
      f.dir = dx >= 0 ? 1 : -1;
      break;

    case 'turret':
      f.dir = dx >= 0 ? 1 : -1;
      if (f.cool <= 0 && Math.abs(dx) < 380) {
        [-80, 0, 80].forEach(vy => shoot(f, f.dir * 190, vy, 'crystal'));
        f.cool = 2.6;
      }
      break;

    case 'boss':
      bossThink(f, dt, dx);
      break;

    default:                                         // skull, knight, golem, bat, shielder
      patrol(f, s.speed, dt);
  }

  if (f.kind === 'worm' && f.rise < 0.5) return;     // harmless while underground
  if (hurt <= 0 && hits(player.x, player.y, PW, PH, f.x, foeTop(f), f.w, f.h))
    damage(s.name + ' got you');
}

function bossThink(f, dt, dx) {
  const s = f.spec;
  if (L.bossKind === 'wraith') {
    // Hovers a steady distance away on whichever side it is on, and fires
    // ice at you. (It used to float straight into you, so you couldn't
    // avoid touching it — the bot lost every heart, the boss healed, repeat.)
    const side = (f.x + f.w / 2) >= pcx() ? 1 : -1;
    const tx = Math.max(300, Math.min(1880, pcx() + side * 230 - f.w / 2));
    f.x += Math.sign(tx - f.x) * Math.min(Math.abs(tx - f.x), s.speed * dt);
    const ty = Math.max(-240, Math.min(-f.h, pcy() - f.h / 2));
    f.gy += Math.sign(ty - f.gy) * Math.min(Math.abs(ty - f.gy), 50 * dt);
    f.dir = dx >= 0 ? 1 : -1;
    if (f.cool <= 0) {
      const dy = pcy() - (f.gy + f.h / 2), d = Math.hypot(dx, dy) || 1;
      shoot(f, dx / d * 170, dy / d * 170, 'ice');   // slow enough to dodge or shoot
      f.cool = 3.0;
    }
    return;
  }
  if (L.bossKind === 'guardian') {
    // shield up for a while (throws a spread of crystals), then down: that
    // gap is your chance to hurt it
    f.shield -= dt;
    if (f.shield < -2.8) {
      f.shield = 2.6;
      const dir = dx >= 0 ? 1 : -1;
      [-110, -40, 0].forEach(vy => shoot(f, dir * 200, vy, 'crystal', 0, -30));
    }
    patrol(f, f.shield > 0 ? s.speed : s.speed * 0.4, dt);
    return;
  }
  patrol(f, s.speed, dt);
  if (L.bossKind === 'magma' && f.cool <= 0 && Math.abs(dx) < 700) {
    // a fireball rolling along the ground: jump it, or shoot it
    shoot(f, (dx >= 0 ? 1 : -1) * 210, 0, 'fire', 0, -14);
    f.cool = 2.4;
  }
}

const bossAlive = () => foes.some(f => f.kind === 'boss' && f.alive);
const doorOpen  = () => !L.boss || !bossAlive();

function onLedge() {
  return plats.some(bk => Math.abs((player.y + PH) - bk.y) < 3 &&
                          player.x + PW > bk.x && player.x < bk.x + bk.w);
}
const near = (x, y, r) =>
  Math.abs(player.x + PW / 2 - x) < r && Math.abs(player.y + PH / 2 - y) < r;

function puff(x, y, n) {
  for (let i = 0; i < n; i++) bits.push({ x, y,
    vx: (Math.random() - 0.5) * 70, vy: -Math.random() * 40, g: 60,
    life: 0.35 + Math.random() * 0.25, r: 2, c: 'rgba(255,255,255,.8)' });
}
function sparkle(x, y, c) {
  bits.push({ x, y, vx: (Math.random() - 0.5) * 130, vy: -40 - Math.random() * 95,
    g: 220, life: 0.45, r: 2, c: c || '#FFE79A' });
}
function ring(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    bits.push({ x, y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, g: 0, life: 0.3, r: 2, c: '#E8A6FF' });
  }
}

function damage(why) {
  hearts--; shake = 0.34;
  Sound.sfx('hurt'); updateHud(); flash(why);
  if (hearts <= 0) {
    flash(cpHit ? 'Out of hearts — back to the checkpoint' : 'Out of hearts — back to the start');
    safeX = cpHit ? cpX : 60; hearts = 3; mana = Math.max(mana, 3);
    magic.forEach(m => m.got = false);
    // The boss does NOT heal. Running out of hearts already sends you back
    // to the start; wiping out all the damage you'd done on top of that was
    // the one thing that made the last boss feel impossible.
    shots = [];
    updateHud();
  }
  respawn();
}

/* ---------- finishing ---------- */
function finish() {
  finished = true; running = false;
  Sound.stop();
  Sound.sfx('win');
  const startLv = Save.get().level;

  Quiz.ask({
    count: 3,
    title: L.name + ' cleared',
    subtitle: 'Three questions to bank it',
    onDone: (earned) => {
      const all = Object.assign({}, Save.get().mrStars || {});
      const had = all[key(wIdx, lIdx)];
      if (had === undefined || starsGot > had) all[key(wIdx, lIdx)] = starsGot;
      Save.update({ mrStars: all, mrPoints: totalPoints() + points + earned });
      showEnd(earned, startLv);
    }
  });
}

/* ==========================================================
   SCREENS
   ========================================================== */
let browseWorld = 0;
const show = (id, on) => { document.getElementById(id).style.display = on ? 'flex' : 'none'; };

// Draw a pixel map into a little picture the page can use as an <img>,
// so the crates show the same monster and stars as the game itself.
const imgCache = {};
function spriteURL(map, pal, scale) {
  const id = map.join('') + JSON.stringify(pal) + scale;
  if (imgCache[id]) return imgCache[id];
  const w = map[0].length, h = map.length;
  const c = document.createElement('canvas');
  c.width = (w + 2) * scale; c.height = (h + 2) * scale;
  const g = c.getContext('2d');
  for (let pass = 0; pass < 2; pass++) {
    for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) {
      const ch = map[r][col];
      if (ch === '.') continue;
      const x = (col + 1) * scale, y = (r + 1) * scale;
      if (pass === 0) {
        g.fillStyle = '#1A1024';
        g.fillRect(x - scale, y, scale * 3, scale);
        g.fillRect(x, y - scale, scale, scale * 3);
      } else {
        g.fillStyle = pal[ch]; g.fillRect(x, y, scale, scale);
      }
    }
  }
  return (imgCache[id] = c.toDataURL());
}

/* --- the card you get when a level is done --- */
function showEnd(earned, startLv) {
  const s = starsGot;
  document.getElementById('endTitle').textContent =
    L.boss ? BOSS[L.bossKind].name + ' beaten!' : 'Level ' + L.name + ' complete';
  document.getElementById('endStars').innerHTML = [0, 1, 2].map(n =>
    '<img class="' + (n === 1 ? 'mid' : '') + '" src="' +
    spriteURL(STAR, n < s ? STAR_INK : GREY_STAR, 5) + '">').join('');
  document.getElementById('endScore').textContent = s + ' out of 3';
  document.getElementById('endPoints').textContent = points;
  document.getElementById('endCoins').textContent  = earned;
  document.getElementById('endLevel').textContent  = Save.get().level
    + (Save.get().level > startLv ? ' (up!)' : '');

  const nxt = nextLevel();
  const btn = document.getElementById('endNext');
  btn.style.display = nxt ? '' : 'none';
  btn.onclick = () => startLevel(nxt[0], nxt[1]);

function nextLevel() {
  if (lIdx + 1 < PER_WORLD) return [wIdx, lIdx + 1];
  if (wIdx + 1 < WORLDS.length) return [wIdx + 1, 0];
  return null;
}

/* --- the world / level picker --- */
function crate(w, i) {
  const lv = WORLDS[w].levels[i];
  const open = isOpen(w, i);
  const got = starsFor(w, i) || 0;
  const face = !open ? '<span class="lock"></span>'
             : lv.boss ? '<img class="skull" src="' + lookURL('boss', lv.bossKind, 4) + '">'
             : '<span class="num">' + (i + 1) + '</span>';
  const pips = [0, 1, 2].map(n =>
    '<img class="' + (n === 1 ? 'mid' : '') + '" src="' +
    spriteURL(STAR, open && n < got ? STAR_INK : GREY_STAR, 3) + '">').join('');
  return '<button class="cell' + (open ? '' : ' locked') + (lv.boss ? ' isboss' : '') + '"'
       + ' data-l="' + i + '"' + (open ? '' : ' disabled') + '>'
       + '<span class="crate"><i class="rv a"></i><i class="rv b"></i><i class="rv c"></i><i class="rv d"></i>'
       + face + '</span><span class="lvstars">' + pips + '</span></button>';
}

function showLevels(w) {
  browseWorld = Math.max(0, Math.min(WORLDS.length - 1, w));
  const world = WORLDS[browseWorld];
  document.getElementById('msWorld').textContent  = 'World ' + (browseWorld + 1);
  document.getElementById('msName').textContent   = world.name;
  document.getElementById('msPoints').textContent = totalPoints();
  document.getElementById('msPrev').style.visibility = browseWorld > 0 ? 'visible' : 'hidden';
  document.getElementById('msNext').style.visibility =
    browseWorld < WORLDS.length - 1 ? 'visible' : 'hidden';

  const levels = world.levels.map((lv, i) => i);
  document.getElementById('msGrid').innerHTML =
    levels.filter(i => !world.levels[i].boss).map(i => crate(browseWorld, i)).join('');
  document.getElementById('msBoss').innerHTML =
    levels.filter(i =>  world.levels[i].boss).map(i => crate(browseWorld, i)).join('');

  document.querySelectorAll('#levelSelect .cell').forEach(bt => {
    bt.onclick = () => startLevel(browseWorld, +bt.dataset.l);
  });

  inMenu = true;
  paused = false; show('pauseCard', false);
  document.body.classList.remove('playing');       // hides the touch buttons
  show('intro', false);
  show('endCard', false);
  show('hud', false);
  show('levelSelect', true);
  Sound.play(songFor(world));
  showMute();
}

function startLevel(w, l) {
  // a button left focused would get "pressed" again by Space, which now fires
  if (document.activeElement) document.activeElement.blur();
  inMenu = false;
  document.body.classList.add('playing');
  show('levelSelect', false);
  show('endCard', false);
  show('hud', true);
  camY = 0; camYSmooth = 0;
  paused = false; show('pauseCard', false);
  loadLevel(w, l);
  Sound.play(L.boss ? 'boss' : songFor(WORLDS[w]));
  introduce();
}

/* ==========================================================
   DRAWING — styled after the reference screenshots.

   Everything goes into a small buffer (380 wide) that is then
   blown up with smoothing off. Circles and hills are drawn a
   row or column at a time with whole pixels, because the
   canvas's own curves come out soft and turn to mush when
   they're enlarged.
   ========================================================== */

const SCALE = 0.5;
let VW = 380, VIEW = VW / SCALE;      // VW shrinks on an upright phone, see fit()
const buf = document.createElement('canvas');
const b   = buf.getContext('2d');
let VH = 260, FLOORV = 210, W = 0, H = 0, camX = 0, camY = 0;
let inMenu = false;
let camYSmooth = 0;               // the smooth camera height; camY is it snapped to pixels

function fit() {
  W = cv.width  = innerWidth;
  H = cv.height = innerHeight;
  // On an upright phone a 380-wide picture made everything tiny, with the
  // mage lost at the bottom of a sky the size of the screen. Show less of the
  // world instead, so the characters stay a sensible size.
  const upright = H > W;
  VW = upright ? 220 : 380;
  VIEW = VW / SCALE;
  VH = Math.max(170, Math.round(VW * H / W));
  buf.width = VW; buf.height = VH;
  FLOORV = Math.round(VH * (upright ? 0.70 : 0.82));   // room for thumbs below
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit);

const vx = x => Math.round((x - camX) * SCALE);
const vy = y => Math.round(FLOORV + (y - camY) * SCALE);
const vs = n => Math.round(n * SCALE);

// a repeatable 0..1 for any whole number, so textures never crawl
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function disc(x, y, r, colour) {
  b.fillStyle = colour;
  for (let dy = -r; dy <= r; dy++) {
    const half = Math.round(Math.sqrt(r * r - dy * dy));
    b.fillRect(Math.round(x - half), Math.round(y + dy), half * 2, 1);
  }
}

/* ---------- sprites: one letter per pixel ---------- */
function sprite(map, pal, x, y, flip, scale = 1, lift) {
  const w = map[0].length;
  const each = fn => {
    for (let r = 0; r < map.length; r++) for (let c = 0; c < w; c++) {
      const ch = map[r][c];
      if (ch === '.') continue;
      fn(ch, flip ? w - 1 - c : c, r + (lift ? lift(ch, c, r) : 0));
    }
  };
  b.fillStyle = '#1A1024';                                   // outline first
  each((ch, c, r) => {
    b.fillRect(x + (c - 1) * scale, y + r * scale, scale * 3, scale);
    b.fillRect(x + c * scale, y + (r - 1) * scale, scale, scale * 3);
  });
  each((ch, c, r) => {
    b.fillStyle = pal[ch];
    b.fillRect(x + c * scale, y + r * scale, scale, scale);
  });
}
