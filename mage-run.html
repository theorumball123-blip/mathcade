// which picture belongs to which creature, and at what size
function foeLook(kind, bossKind) {
  if (kind === 'boss') {
    if (bossKind === 'magma')  return { map: GOLEM,   ink: MAGMA_INK,  scale: 2 };
    if (bossKind === 'wraith') return { map: GHOST,   ink: WRAITH_INK, scale: 2 };
    if (bossKind === 'guardian') return { map: GOLEM, ink: GUARDIAN_INK, scale: 2 };
    return { map: MONSTER, ink: MONSTER_INK, scale: 2 };
  }
  switch (kind) {
    case 'bat':     return { map: BAT_UP,  ink: BAT_INK,     scale: 1 };
    case 'hopper':  return { map: HOPPER,  ink: HOPPER_INK,  scale: 1 };
    case 'charger': return { map: CHARGER, ink: CHARGER_INK, scale: 1 };
    case 'spitter': return { map: SPITTER, ink: SPITTER_INK, scale: 1 };
    case 'knight':  return { map: KNIGHT,  ink: KNIGHT_INK,  scale: 1 };
    case 'ghost':   return { map: GHOST,   ink: GHOST_INK,   scale: 1 };
    case 'golem':   return { map: GOLEM,   ink: GOLEM_INK,   scale: 1 };
    case 'bird':    return { map: BIRD_UP, ink: BIRD_INK,    scale: 1 };
    case 'worm':    return { map: WORM,    ink: WORM_INK,    scale: 1 };
    case 'turret':  return { map: TURRET,  ink: TURRET_INK,  scale: 1 };
    case 'shielder':return { map: KNIGHT,  ink: SHIELDER_INK, scale: 1 };
    default:        return { map: MONSTER, ink: MONSTER_INK, scale: 1 };
  }
}
const lookURL = (kind, bossKind, scale) => {
  const l = foeLook(kind, bossKind);
  return spriteURL(l.map, l.ink, scale * l.scale);
};

/* ---------- the backdrop ----------
   Each world has its own scene, not just its own colours. (Worlds 1-3 used
   to share one meadow, one set of boulders and - for 2 and 3 - one row of
   rocks, so they all looked the same.) Every layer's offset is rounded to a
   whole pixel so the layer slides as one piece and never shimmers.        */
// base is where the scenery meets the play area, horizon is the far line
function drawBackdrop(T, cx, base, horizon) {
  if (T.cave) return drawCave(T, cx, base, horizon);
  if (T.lava) return drawVolcano(T, cx, base, horizon);
  if (T.snow) return drawFrost(T, cx, base, horizon);
  drawFields(T, cx, base, horizon);
}

// a layer that repeats every `period` pixels, moving at `par` of the camera
const layerOff = (cx, par) => Math.round(cx * SCALE * par);

/* ---------- world 1: the reference look ---------- */
function drawFields(T, cx, base, horizon) {
  const g = b.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  b.fillStyle = g; b.fillRect(0, 0, VW, VH);

  // one long bank of cloud sitting on the horizon
  const off = layerOff(cx, 0.07) % 96;
  for (let pass = 0; pass < 3; pass++) {
    for (let i = -3; i < VW / 32 + 4; i++) {
      const k = ((i % 3) + 3) % 3;
      const x = i * 32 - off + (k === 1 ? 10 : 0);
      const r = 13 + k * 6, y = horizon - 6 - k * 7;
      if (pass === 0) disc(x, y + 5, r + 3, T.cloudBase);
      if (pass === 1) disc(x, y + 1, r, T.cloudShade);
      if (pass === 2) disc(x - 3, y - 2, r - 3, T.cloud);
    }
  }

  // rolling hills
  const hillOff = layerOff(cx, 0.16);
  b.fillStyle = T.far;
  for (let x = 0; x < VW; x++) {
    const w = x + hillOff;
    const top = horizon + 4 - Math.round(Math.sin(w * 0.045) * 4 + Math.sin(w * 0.012) * 6 + 6);
    b.fillRect(x, top, 1, VH - top);
  }

  // the meadow, with grass blades fixed to their spot
  const mTop = horizon + 14;
  b.fillStyle = T.meadow; b.fillRect(0, mTop, VW, VH - mTop);
  const grassOff = layerOff(cx, 0.34);
  for (let y = mTop + 3; y < base + 40 && y < VH; y += 4) {
    for (let x = 0; x < VW; x++) {
      const n = hash((x + grassOff) * 7 + y * 131);
      if (n < 0.05)       { b.fillStyle = T.meadowDark;  b.fillRect(x, y, 1, 3); }
      else if (n > 0.975) { b.fillStyle = T.meadowLight; b.fillRect(x, y, 1, 2); }
    }
  }

  // boulders
  const rockOff = layerOff(cx, 0.34);
  for (let i = -1; i < VW / 150 + 2; i++) {
    const n = Math.floor(rockOff / 150) + i;
    const x = n * 150 - rockOff + Math.round(hash(n) * 60);
    const gy = mTop + Math.round((base - mTop) * (0.45 + hash(n + 9) * 0.35));
    const r = 9 + Math.round(hash(n + 3) * 6);
    disc(x, gy, r + 1, T.rockDark);
    disc(x, gy - 1, r, T.rock);
    disc(x - Math.round(r * 0.35), gy - Math.round(r * 0.4), Math.round(r * 0.45), T.rockLight);
    b.fillStyle = T.rockDark; b.fillRect(x - r - 1, gy + 1, r * 2 + 2, Math.ceil(r * 0.6));
    disc(x + r + 5, gy + 3, Math.round(r * 0.5), T.rockDark);
    disc(x + r + 5, gy + 2, Math.round(r * 0.45), T.rock);
  }
}

/* ---------- world 2: a volcano, mesas and a lava river ---------- */
function drawVolcano(T, cx, base, horizon) {
  const now = performance.now() / 1000;
  const g = b.createLinearGradient(0, 0, 0, base);
  g.addColorStop(0, '#F4D29A'); g.addColorStop(0.55, T.sky[0]); g.addColorStop(1, '#C8583A');
  b.fillStyle = g; b.fillRect(0, 0, VW, VH);

  // the volcano, far off, with a glowing crater and a plume of smoke
  const period = 900, vOff = layerOff(cx, 0.05) % period;
  for (const k of [0, 1]) {
    const px = Math.round(VW * 0.66) - vOff + k * period;
    if (px < -140 || px > VW + 140) continue;
    const peakY = horizon - 74;
    for (let x = px - 130; x <= px + 130; x++) {
      if (x < 0 || x >= VW) continue;
      const d = Math.abs(x - px);
      const top = d < 12 ? peakY + 3 : peakY + Math.round((d - 12) * 0.62);
      b.fillStyle = x < px ? '#8C4436' : '#6E3530';
      b.fillRect(x, top, 1, VH - top);
    }
    disc(px, peakY + 2, 12, 'rgba(255,170,60,.35)');
    b.fillStyle = '#FFB03A'; b.fillRect(px - 11, peakY + 1, 22, 3);
    b.fillStyle = '#FFE14A'; b.fillRect(px - 7, peakY + 1, 14, 1);
    b.fillStyle = '#FF6A2A';                          // lava running down
    for (let i = 0; i < 28; i++) {
      b.fillRect(px - 6 - Math.round(i * 0.62), peakY + 4 + i, 2, 1);
      if (i < 18) b.fillRect(px + 7 + Math.round(i * 0.62), peakY + 4 + i, 2, 1);
    }
    for (let i = 0; i < 7; i++) {                     // smoke
      const rise = (now * 11 + i * 13) % 90;
      const sx = px + Math.round(Math.sin(i * 1.7 + now * 0.4) * 5 + rise * 0.25);
      b.globalAlpha = 0.5 * (1 - rise / 90);
      disc(sx, peakY - 6 - Math.round(rise), 4 + Math.round(rise * 0.09), '#5E4A48');
    }
    b.globalAlpha = 1;
  }

  // flat-topped mesas, with layered rock lines
  const mesaBase = horizon + 26, mOff = layerOff(cx, 0.15);
  b.fillStyle = T.rock; b.fillRect(0, mesaBase - 4, VW, VH);
  for (let i = -1; i < VW / 130 + 2; i++) {
    const n = Math.floor(mOff / 130) + i;
    const x0 = n * 130 - mOff + Math.round(hash(n + 1) * 40);
    const w = 44 + Math.round(hash(n + 2) * 50), h = 26 + Math.round(hash(n + 3) * 30);
    for (let x = x0; x < x0 + w; x++) {
      if (x < 0 || x >= VW) continue;
      const edge = Math.min(x - x0, x0 + w - 1 - x);
      const top = mesaBase - h + (edge < 3 ? 3 - edge : 0);
      b.fillStyle = T.far; b.fillRect(x, top, 1, mesaBase - top);
      b.fillStyle = T.rockLight; b.fillRect(x, top, 1, 2);
      b.fillStyle = T.rock;
      for (let s = top + 8; s < mesaBase - 2; s += 7) b.fillRect(x, s, 1, 1);
    }
  }

  // the scorched ground in front, and rock spires on it
  const mTop = horizon + 14 + 20;
  b.fillStyle = T.meadow; b.fillRect(0, mTop, VW, VH - mTop);
  const spOff = layerOff(cx, 0.32);
  for (let i = -1; i < VW / 95 + 2; i++) {
    const n = Math.floor(spOff / 95) + i;
    const cx0 = n * 95 - spOff + Math.round(hash(n + 7) * 50);
    const hw = 6 + Math.round(hash(n + 8) * 5), h = 34 + Math.round(hash(n + 9) * 30);
    const foot = mTop + 16 + Math.round(hash(n + 4) * 10);
    for (let dx = -hw; dx <= hw; dx++) {
      const x = cx0 + dx;
      if (x < 0 || x >= VW) continue;
      const top = foot - Math.round(h * (1 - Math.abs(dx) / (hw + 1)));
      b.fillStyle = dx < 0 ? T.meadowLight : T.meadowDark;
      b.fillRect(x, top, 1, foot - top);
    }
  }
  const crackOff = layerOff(cx, 0.34);
  b.fillStyle = '#E0504A';
  for (let y = mTop + 6; y < base - 12; y += 6)
    for (let x = 0; x < VW; x++)
      if (hash((x + crackOff) * 13 + y * 71) < 0.008) b.fillRect(x, y, 4, 1);

  // the lava river in the distance, gently glowing
  const riverY = base - 11, rOff = layerOff(cx, 0.34);
  b.fillStyle = '#B83A2A'; b.fillRect(0, riverY, VW, 6);
  b.fillStyle = '#E0504A'; b.fillRect(0, riverY + 1, VW, 3);
  const tick = Math.floor(now * 3);
  for (let x = 0; x < VW; x++) {
    const n = hash((x + rOff) * 5 + tick * 997);
    if (n > 0.93) { b.fillStyle = '#FFB03A'; b.fillRect(x, riverY + 1 + (n > 0.97 ? 1 : 0), 2, 1); }
  }

  // embers drifting up
  for (let i = 0; i < 30; i++) {
    const x = ((hash(i) * VW - layerOff(cx, 0.2) + Math.sin(now + i) * 5) % VW + VW) % VW;
    const y = VH - ((hash(i + 9) * VH + now * (10 + hash(i + 5) * 14)) % VH);
    b.fillStyle = hash(i + 4) > 0.5 ? '#FFB03A' : '#FF6A2A';
    b.fillRect(x | 0, y | 0, 1, 1);
  }
}

/* ---------- world 3: a frozen night with the aurora ---------- */
function drawFrost(T, cx, base, horizon) {
  const now = performance.now() / 1000;
  const g = b.createLinearGradient(0, 0, 0, base);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  b.fillStyle = g; b.fillRect(0, 0, VW, VH);

  for (let i = 0; i < 46; i++) {                     // stars
    const sx = Math.floor(hash(i * 7) * VW), sy = Math.floor(hash(i * 13) * horizon * 0.85);
    b.fillStyle = hash(i + Math.floor(now / 0.7)) > 0.85 ? '#FFFFFF' : '#9FB4E8';
    b.fillRect(sx, sy, 1, 1);
  }

  // the moon
  const mx = Math.round(VW * 0.8), my = Math.round(VH * 0.13);
  disc(mx, my, 20, 'rgba(220,230,255,.10)');
  disc(mx, my, 11, '#E8EEFF');
  disc(mx - 3, my - 2, 3, '#C9D2EA'); disc(mx + 4, my + 3, 2, '#C9D2EA');

  // the aurora: two slow ribbons of light
  for (const [col, at, amp, sp] of [['#5FE0A0', 0.16, 9, 0.35], ['#A07BFF', 0.25, 7, 0.5]]) {
    for (let x = 0; x < VW; x++) {
      const y = Math.round(VH * at + Math.sin(x * 0.024 + now * sp) * amp + Math.sin(x * 0.07 + now * 0.8) * 3);
      b.globalAlpha = 0.14; b.fillStyle = col; b.fillRect(x, y, 1, 16);
      b.globalAlpha = 0.32; b.fillRect(x, y + 3, 1, 3);
    }
  }
  b.globalAlpha = 1;

  // snow-capped mountains
  const mOff = layerOff(cx, 0.12);
  for (let x = 0; x < VW; x++) {
    const w = x + mOff;
    const tri = 1 - Math.abs(((w % 90) / 45) - 1);
    const h = 18 + Math.round(tri * 42 + hash(Math.floor(w / 90)) * 12);
    const top = horizon + 10 - h;
    b.fillStyle = T.far; b.fillRect(x, top, 1, VH - top);
    b.fillStyle = '#EAF2FF'; b.fillRect(x, top, 1, tri > 0.55 ? 3 + Math.round((tri - 0.55) * 14) : 2);
  }

  // rolling snowdrifts
  const mTop = horizon + 14;
  const dOff = layerOff(cx, 0.24);
  for (let x = 0; x < VW; x++) {
    const w = x + dOff;
    const top = mTop - 4 + Math.round(Math.sin(w * 0.03) * 4 + Math.sin(w * 0.011) * 5);
    b.fillStyle = '#8EA3D2'; b.fillRect(x, top, 1, VH - top);
    b.fillStyle = '#DCE7FA'; b.fillRect(x, top, 1, 1);
  }

  // snowy pine trees, two rows
  for (const [par, spacing, scale, col] of [[0.3, 46, 0.75, '#2E4272'], [0.42, 64, 1, '#1E2E54']]) {
    const tOff = layerOff(cx, par);
    for (let i = -1; i < VW / spacing + 2; i++) {
      const n = Math.floor(tOff / spacing) + i;
      const x0 = n * spacing - tOff + Math.round(hash(n * 3 + par * 10) * 26);
      const h = Math.round((30 + hash(n + 11) * 22) * scale);
      const foot = mTop + Math.round((10 + hash(n + 13) * 12) * scale) + (scale < 1 ? 0 : 10);
      b.fillStyle = '#1A2440'; b.fillRect(x0 - 1, foot - 3, 3, 4);
      for (let r = 0; r < h; r++) {
        const tier = r % Math.max(6, Math.round(h / 3));
        const hw = Math.round(1 + r * 0.26 - tier * 0.25);
        const y = foot - h + r - 3;
        b.fillStyle = col; b.fillRect(x0 - hw, y, hw * 2 + 1, 1);
        if (tier === 0 && r > 0) { b.fillStyle = '#DDE8F8'; b.fillRect(x0 - hw, y, hw * 2 + 1, 1); }
      }
      b.fillStyle = '#FFFFFF'; b.fillRect(x0, foot - h - 3, 1, 1);
    }
  }

  // sparkles in the snowfield in front
  const sOff = layerOff(cx, 0.34);
  b.fillStyle = '#FFFFFF';
  for (let y = mTop + 22; y < base + 20 && y < VH; y += 5)
    for (let x = 0; x < VW; x++)
      if (hash((x + sOff) * 11 + y * 53) < 0.006) b.fillRect(x, y, 1, 1);
}

/* ---------- world 4: underground ---------- */
function drawCave(T, cx, base, horizon) {
  const g = b.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  b.fillStyle = g; b.fillRect(0, 0, VW, VH);

  // the far wall, with stalactites hanging from the roof
  const farOff = Math.round(cx * SCALE * 0.15);
  for (let x = 0; x < VW; x++) {
    const w = x + farOff;
    const tooth = Math.abs(((w * 1.0) % 26) - 13) / 13;
    const drop = 18 + Math.round((1 - tooth) * 34 * hash(Math.floor(w / 26)));
    b.fillStyle = T.far; b.fillRect(x, 0, 1, drop);
    b.fillStyle = T.meadowDark; b.fillRect(x, drop - 2, 1, 2);
  }

  // crystals set into the wall, glowing
  const crOff = Math.round(cx * SCALE * 0.3);
  for (let i = -1; i < VW / 70 + 2; i++) {
    const n = Math.floor(crOff / 70) + i;
    const x = n * 70 - crOff + Math.round(hash(n) * 40);
    // on the wall, between the stalactites and the floor (lower down they
    // were being painted over by the cave floor and never showed)
    const y = Math.round(58 + hash(n + 5) * Math.max(10, horizon - 50));
    const col = hash(n + 2) > 0.5 ? '#6FE0D8' : '#E07BD8';
    const pulse = 5 + Math.round(Math.sin(performance.now() / 600 + n) * 1.5);
    b.globalAlpha = 0.25; disc(x, y, pulse + 3, col); b.globalAlpha = 1;
    b.fillStyle = '#1A1024'; b.fillRect(x - 2, y - 5, 5, 10);
    b.fillStyle = col;       b.fillRect(x - 1, y - 4, 3, 8);
    b.fillStyle = '#FFFFFF'; b.fillRect(x, y - 3, 1, 3);
  }

  // the cave floor behind you, with rocks
  b.fillStyle = T.meadow; b.fillRect(0, horizon + 20, VW, VH);
  const rockOff = Math.round(cx * SCALE * 0.34);
  for (let i = -1; i < VW / 120 + 2; i++) {
    const n = Math.floor(rockOff / 120) + i;
    const x = n * 120 - rockOff + Math.round(hash(n) * 50);
    const gy = horizon + 20 + Math.round((base - horizon - 20) * (0.4 + hash(n + 9) * 0.4));
    const r = 7 + Math.round(hash(n + 3) * 6);
    disc(x, gy + 1, r + 1, T.rockDark); disc(x, gy, r, T.rock);
    disc(x - Math.round(r * 0.35), gy - Math.round(r * 0.4), Math.round(r * 0.4), T.rockLight);
    b.fillStyle = T.rockDark; b.fillRect(x - r - 1, gy + 1, r * 2 + 2, Math.ceil(r * 0.6));
  }

  // glowing specks drifting up through the air
  const now = performance.now() / 1000;
  for (let i = 0; i < 36; i++) {
    const x = ((hash(i) * VW - Math.round(cx * SCALE * 0.2) + Math.sin(now + i) * 6) % VW + VW) % VW;
    const y = VH - ((hash(i + 9) * VH + now * (6 + hash(i + 5) * 8)) % VH);
    b.fillStyle = hash(i + 4) > 0.5 ? '#A8FFF2' : '#F0B8FF';
    b.fillRect(x | 0, y | 0, 1, 1);
  }
}

/* ---------- a chunk of ground or a floating ledge ---------- */
function drawBlock(blk, isGround) {
  const x = vx(blk.x), y = vy(blk.y), w = vs(blk.w);
  if (x > VW + 2 || x + w < -2) return;
  const h = isGround ? VH - y + 2 : vs(blk.h);
  const cap = isGround ? 7 : 5;          // chunky grass, like the reference

  b.fillStyle = TH.dirt; b.fillRect(x, y, w, h);

  // the cobblestone band under the grass, and down both sides
  for (let row = 0; row < (isGround ? 3 : 2); row++) {
    for (let i = row * 2; i < w - 1; i += 4) {
      b.fillStyle = hash(blk.x + i * 3 + row * 17) < 0.5 ? TH.pebble : TH.pebbleDark;
      b.fillRect(x + i, y + cap + row * 2, 3, 2);
    }
  }
  const sideDepth = Math.min(h, isGround ? 70 : h);
  for (let j = cap; j < sideDepth; j += 3) {
    b.fillStyle = hash(blk.x + j) < 0.5 ? TH.pebble : TH.pebbleDark;
    b.fillRect(x, y + j, 2, 2);
    b.fillRect(x + w - 2, y + j + 1, 2, 2);
  }

  // grass: overhangs the edge a pixel, bright top line, tufts poking up
  b.fillStyle = TH.grassDark; b.fillRect(x - 1, y, w + 2, cap);
  b.fillStyle = TH.grass;     b.fillRect(x - 1, y, w + 2, cap - 1);
  b.fillStyle = TH.grassLight; b.fillRect(x, y, w, 1);
  for (let i = 0; i < w; i += 2) {
    const n = hash(blk.x + i * 5);
    if (n < 0.45) { b.fillStyle = n < 0.2 ? TH.grassLight : TH.grass; b.fillRect(x + i, y - 1, 1, 1); }
    if (n < 0.1)  { b.fillStyle = TH.grassLight; b.fillRect(x + i, y - 2, 1, 1); }
    if (n > 0.85) { b.fillStyle = TH.grassDark; b.fillRect(x + i, y + cap, 1, 1); }
  }
  if (!isGround) { b.fillStyle = 'rgba(0,0,0,.28)'; b.fillRect(x, y + h, w, 1); }
}

/* ---------- the level ---------- */
function drawFoe(f) {
  if (!f.alive) return;
  const x = vx(f.x), top = vy(foeTop(f));
  if (x < -60 || x > VW + 60) return;
  const look = foeLook(f.kind, L.bossKind);
  let map = look.map, ink = look.ink;
  const step = Math.floor(f.t * 6) % 2;
  const flip = f.dir < 0;

  if (f.kind === 'bat')  map = Math.sin(f.t * 9) > 0 ? BAT_UP : BAT_DOWN;
  if (f.kind === 'bird') map = Math.sin(f.t * 8) > 0 ? BIRD_UP : BIRD_DOWN;
  if (f.kind === 'charger' && f.charge > 0) ink = CHARGING_INK;
  if (f.flash > 0) ink = Object.fromEntries(Object.keys(ink).map(k => [k, '#FFFFFF']));

  // walkers step their feet; everything else just floats or hops
  const walkers = { skull: 13, slime: 13, knight: 13, golem: 15, charger: 9 };
  const feetRow = f.kind === 'boss' && !f.spec.fly ? 13 : walkers[f.kind];
  const lift = feetRow ? (ch, c, r) => (r >= feetRow ? ((c < map[0].length / 2 ? step : 1 - step) ? -1 : 0) : 0) : null;

  if (f.kind === 'worm') {
    // only the part that has come up out of the ground is drawn
    const rows = Math.round(map.length * f.rise);
    if (rows > 0) sprite(map.slice(0, rows), ink, x, vy(0) - rows, flip, 1);
    return;
  }

  if (f.kind === 'ghost' || (f.kind === 'boss' && f.spec.fly)) b.globalAlpha = 0.75 + Math.sin(f.t * 5) * 0.15;
  sprite(map, ink, x, top + (f.kind === 'bat' || f.kind === 'bird' ? 1 : 0), flip, look.scale, lift);
  b.globalAlpha = 1;

  if (f.kind === 'shielder') {
    // the shield, on the side it is facing
    const sx = flip ? x - 3 : x + 12;
    b.fillStyle = '#1A1024'; b.fillRect(sx - 1, top + 4, 5, 13);
    b.fillStyle = '#FFC53D'; b.fillRect(sx, top + 5, 3, 11);
    b.fillStyle = '#6FE0D8'; b.fillRect(sx + 1, top + 7, 1, 7);
  }
  if (f.kind === 'boss' && L.bossKind === 'guardian' && f.shield > 0) {
    // the barrier: a shimmering ring you can't shoot through
    const cx = x + 20, cy = top + 18, r = 26 + Math.round(Math.sin(f.t * 8) * 1.5);
    b.globalAlpha = 0.35; disc(cx, cy, r, '#6FE0D8'); b.globalAlpha = 1;
    b.fillStyle = '#D8FFFA';
    for (let i = 0; i < 12; i++) {
      const ang = i / 12 * Math.PI * 2 + f.t;
      b.fillRect(Math.round(cx + Math.cos(ang) * r), Math.round(cy + Math.sin(ang) * r), 2, 2);
    }
  }

  if (f.kind === 'boss' && L.bossKind === 'skullking') {
    // a little gold crown for the Skull King
    const cx = x + 13, cy = top - 6;
    b.fillStyle = '#1A1024'; b.fillRect(cx - 1, cy - 1, 28, 8);
    b.fillStyle = '#FFC53D'; b.fillRect(cx, cy + 2, 26, 4);
    b.fillRect(cx, cy - 2, 4, 4); b.fillRect(cx + 11, cy - 4, 4, 6); b.fillRect(cx + 22, cy - 2, 4, 4);
  }

  // tough creatures show how many hits they have left
  if (f.kind !== 'boss' && f.maxHp > 1) {
    const w = vs(f.w);
    b.fillStyle = '#1A1024'; b.fillRect(x - 1, top - 5, w + 2, 4);
    b.fillStyle = '#3A2233'; b.fillRect(x, top - 4, w, 2);
    b.fillStyle = '#FF5A4D'; b.fillRect(x, top - 4, Math.round(w * f.hp / f.maxHp), 2);
  }
}

function drawMage() {
  if (hurt > 0 && Math.floor(hurt * 14) % 2) return;
  const px = vx(player.x), py = vy(player.y);
  const flip = player.face < 0;
  const air = !player.onGround;
  const phase = Math.floor(player.walk / 14) % 2;
  const moving = player.onGround && Math.abs(player.vx) > 40;
  const bob = moving && phase ? 1 : 0;

  sprite(MAGE, MAGE_INK, px, py, flip, 1, (ch, c) => {
    if (ch === 'B') return air ? -1 : moving ? -((c < 8 ? phase : 1 - phase)) : 0;
    return bob;
  });

  // staff, and a glowing tip that flares when you fire
  const sx = px + (flip ? 0 : 15);
  b.fillStyle = '#1A1024'; b.fillRect(sx - 1, py + 7 + bob, 3, 14);
  b.fillStyle = '#8A5A3C'; b.fillRect(sx, py + 8 + bob, 1, 12);
  const glow = reload > 0 ? 4 : 3;
  disc(sx, py + 6 + bob, glow, 'rgba(255,120,220,.45)');
  disc(sx, py + 6 + bob, 2, '#FF6FD0');
  b.fillStyle = '#FFFFFF'; b.fillRect(sx, py + 5 + bob, 1, 1);
}

function drawScene() {
  // follow sideways, and up — before, the camera never moved up, so almost
  // every star (up on the high ledges) was above the top of the screen
  camX = Math.max(0, player.x - VIEW * 0.33);
  camX = Math.round(camX * SCALE) / SCALE;           // whole pixels: no wobble
  const topBand = VH * 0.40;
  const wantY = Math.min(0, player.y + (FLOORV - topBand) / SCALE);
  camYSmooth += (wantY - camYSmooth) * 0.12;
  camY = Math.round(camYSmooth * SCALE) / SCALE;
  const sh = shake > 0 ? Math.round((Math.random() - 0.5) * 5) : 0;

  const base = Math.round(FLOORV - camY * SCALE * 0.4);
  drawBackdrop(TH, camX, base, base - Math.round(VH * 0.36));

  // below the grass line is a dark drop — only pits show it
  const top = vy(0);
  const pit = b.createLinearGradient(0, top, 0, VH);
  pit.addColorStop(0, '#231833'); pit.addColorStop(1, '#07050D');
  b.fillStyle = pit; b.fillRect(0, top, VW, VH - top);

  b.save(); b.translate(0, sh);

  ground.forEach(g2 => drawBlock(g2, true));
  plats.forEach(p2 => drawBlock(p2, false));

  decor.forEach(d => {
    const x = vx(d.x), gy = vy(0);
    if (x < -20 || x > VW + 20) return;
    if (d.kind === 'rock') {
      const r = Math.round(3 * d.s) + 1;
      disc(x, gy - r + 1, r + 1, TH.rockDark); disc(x, gy - r, r, TH.rock);
      b.fillStyle = TH.rockLight; b.fillRect(x - 1, gy - r * 2 + 1, 2, 1);
    } else if (d.kind === 'bush') {
      const r = Math.round(3 * d.s) + 2;
      disc(x, gy - r + 1, r + 1, TH.grassDark); disc(x, gy - r, r, TH.grass);
      b.fillStyle = TH.grassLight; b.fillRect(x - 1, gy - r * 2 + 1, 2, 1);
    } else {
      b.fillStyle = TH.grassLight;
      b.fillRect(x - 2, gy - 3, 1, 3); b.fillRect(x, gy - 4, 1, 4); b.fillRect(x + 2, gy - 3, 1, 3);
    }
  });

  spikes.forEach(s => {
    const x = vx(s.x), w = vs(s.w), gy = vy(0);
    if (x > VW || x + w < 0) return;
    for (let i = 0; i < w; i += 6) {
      for (let c = 0; c < 6; c++) {
        const hgt = Math.round(10 - Math.abs(c - 2.5) * 3.6);
        b.fillStyle = '#1A1024'; b.fillRect(x + i + c, gy - hgt - 1, 1, hgt + 1);
        b.fillStyle = c < 3 ? '#F2F5FA' : '#B6BFCC'; b.fillRect(x + i + c, gy - hgt, 1, hgt);
      }
    }
  });

  magic.forEach(m => {
    if (m.got) return;
    const x = vx(m.x);
    if (x < -20 || x > VW + 20) return;
    sprite(ORB, ORB_INK, x - 3, vy(m.y) - 4 + Math.round(Math.sin(m.t) * 1.5), false);
  });

  stars.forEach(s => {
    if (s.got) return;
    const x = vx(s.x);
    if (x < -24 || x > VW + 24) return;
    const y = vy(s.y) + Math.round(Math.sin(time * 2.4 + s.x) * 2);
    disc(x, y, 9, 'rgba(255,220,90,.25)');
    sprite(STAR, STAR_INK, x - 5, y - 5, false);
  });

  foes.forEach(drawFoe);

  bolts.forEach(bo => {
    const x = vx(bo.x), y = vy(bo.y);
    disc(x, y, 4, 'rgba(255,120,220,.4)');
    disc(x, y, 2, '#FF6FD0');
    b.fillStyle = '#FFFFFF'; b.fillRect(x, y - 1, 1, 1);
  });

  // the doorway home: a stone arch that glows once it is open
  const gx = vx(L.goal), gy = vy(0);
  if (gx > -50 && gx < VW + 50) {
    const open = doorOpen();
    b.fillStyle = '#1A1024'; b.fillRect(gx - 18, gy - 64, 36, 64);
    b.fillStyle = '#8E86A8'; b.fillRect(gx - 17, gy - 63, 34, 63);
    b.fillStyle = '#B4ADCB'; b.fillRect(gx - 17, gy - 63, 34, 3);
    b.fillStyle = '#1A1024'; b.fillRect(gx - 12, gy - 54, 24, 54);
    if (open) {
      const pulse = Math.round(2 + Math.sin(time * 3) * 1.5);
      b.fillStyle = 'rgba(255,200,70,.35)';
      b.fillRect(gx - 11 - pulse, gy - 53 - pulse, 22 + pulse * 2, 53 + pulse);
      b.fillStyle = '#FFC53D'; b.fillRect(gx - 11, gy - 53, 22, 53);
      b.fillStyle = '#FFF1BF'; b.fillRect(gx - 7, gy - 47, 14, 47);
    } else {
      b.fillStyle = '#3A2F46'; b.fillRect(gx - 11, gy - 53, 22, 53);
      b.fillStyle = '#6B5E7E';
      b.fillRect(gx - 5, gy - 32, 10, 9); b.fillRect(gx - 3, gy - 38, 6, 6);
      b.fillStyle = '#3A2F46'; b.fillRect(gx - 1, gy - 36, 2, 4);
      b.fillStyle = '#1A1024'; b.fillRect(gx - 1, gy - 29, 2, 4);
    }
  }

  if (cpX) {
    // the checkpoint flag: grey until you reach it, then gold and waving
    const fx = vx(cpX), fy = vy(0);
    if (fx > -20 && fx < VW + 20) {
      b.fillStyle = '#1A1024'; b.fillRect(fx - 1, fy - 44, 4, 44);
      b.fillStyle = '#C9C2D8'; b.fillRect(fx, fy - 43, 2, 43);
      const wave = cpHit ? Math.round(Math.sin(time * 6) * 1) : 0;
      b.fillStyle = '#1A1024'; b.fillRect(fx + 2, fy - 44 + wave, 16, 11);
      b.fillStyle = cpHit ? '#FFC53D' : '#7C8499';
      b.fillRect(fx + 2, fy - 43 + wave, 15, 9);
      if (cpHit) { b.fillStyle = '#FFF1BF'; b.fillRect(fx + 4, fy - 41 + wave, 4, 2); }
    }
  }

  drawMage();

  bits.forEach(p => { b.fillStyle = p.c; b.fillRect(vx(p.x) | 0, vy(p.y) | 0, p.r, p.r); });

  // shots coming at you
  shots.forEach(sh => {
    const x = vx(sh.x), y = vy(sh.y);
    if (sh.kind === 'rock') {
      disc(x, y, 3, '#1A1024'); disc(x, y, 2, '#8C91A6');
    } else if (sh.kind === 'crystal') {
      disc(x, y, 4, 'rgba(111,224,216,.35)'); disc(x, y, 2, '#6FE0D8');
      b.fillStyle = '#FFFFFF'; b.fillRect(x, y - 1, 1, 1);
    } else if (sh.kind === 'ice') {
      disc(x, y, 4, 'rgba(160,220,255,.4)'); disc(x, y, 2, '#BFE9FF');
      b.fillStyle = '#FFFFFF'; b.fillRect(x, y - 1, 1, 1);
    } else {
      disc(x, y, 5, 'rgba(255,120,40,.35)'); disc(x, y, 3, '#FF6A2A'); disc(x, y, 1, '#FFE14A');
    }
  });

  b.restore();

  if (TH.snow) {
    const now = performance.now() / 1000;
    b.fillStyle = '#FFFFFF';
    for (let i = 0; i < 70; i++) {
      const x = ((hash(i) * VW + now * (8 + hash(i + 3) * 10) - camX * SCALE * 0.2) % VW + VW) % VW;
      const y = ((hash(i + 9) * VH + now * (14 + hash(i + 5) * 18)) % VH);
      b.fillRect(x | 0, y | 0, hash(i + 1) > 0.7 ? 2 : 1, 1);
    }
  }
}

// the level picker has the world's landscape slowly drifting behind it
function drawMenuScene() {
  const T = WORLDS[browseWorld];
  const pan = performance.now() / 1000 * 40;
  drawBackdrop(T, pan, VH + 4, Math.round(VH * 0.70));
}

function draw() {
  // Don't rely only on the resize event: it can be missed or arrive before
  // the new size is ready (a phone's address bar sliding away, rotating,
  // going full screen), which left the game drawn in one corner of the
  // screen. Checking each frame costs nothing.
  if (cv.width !== innerWidth || cv.height !== innerHeight) fit();
  if (inMenu) drawMenuScene();
  else if (L) drawScene();
  else return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, VW, VH, 0, 0, W, H);
}

/* ==========================================================
   INPUT — Space fires, Up jumps
   ========================================================== */
function press(which, down) {
  if (which === 'jump') { if (down && !held.jump) buffer = BUFFER; held.jump = down; }
  else held[which] = down;
}

addEventListener('keydown', e => {
  if (Quiz.isOpen()) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft'  || k === 'a') { press('left', true);  e.preventDefault(); }
  if (k === 'arrowright' || k === 'd') { press('right', true); e.preventDefault(); }
  if (k === 'arrowdown'  || k === 's') { press('down', true);  e.preventDefault(); }
  if (k === 'arrowup'    || k === 'w') { press('jump', true);  e.preventDefault(); }
  if (k === ' ' || k === 'f')          { press('fire', true);  e.preventDefault(); }
  if (k === 'escape' && running) pause();
  if (k === 'm') { Sound.toggle(); showMute(); }
  if (paused) return;
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft'  || k === 'a') press('left', false);
  if (k === 'arrowright' || k === 'd') press('right', false);
  if (k === 'arrowdown'  || k === 's') press('down', false);
  if (k === 'arrowup'    || k === 'w') press('jump', false);
  if (k === ' ' || k === 'f')          press('fire', false);
});

['left', 'right', 'down', 'jump', 'fire'].forEach(id => {
  const el = document.getElementById('btn-' + id);
  if (!el) return;
  const on  = e => { e.preventDefault(); press(id, true);  };
  const off = e => { e.preventDefault(); press(id, false); };
  el.addEventListener('touchstart', on,  { passive: false });
  el.addEventListener('touchend',   off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });   // or a button can stick down
  el.addEventListener('mousedown',  on);
  el.addEventListener('mouseup',    off);
  el.addEventListener('mouseleave', off);
});

// Pause used to drop you straight back to the level picker, losing the
// level you were in. Now it actually pauses.
function pause() {
  if (inMenu || finished || Quiz.isOpen()) return;
  paused = !paused;
  Sound.sfx('click');
  Object.keys(held).forEach(k => held[k] = false);
  show('pauseCard', paused);
}

/* ---------- loop ---------- */
let last = 0;
function frame(t) {
  const dt = Math.min(0.033, last ? (t - last) / 1000 : 0.016);
  last = t;
  step(dt);
  Sound.setDuck(paused || Quiz.isOpen());     // quieter behind menus and questions
  draw();
  requestAnimationFrame(frame);
}

document.getElementById('msPrev').onclick    = () => showLevels(browseWorld - 1);
document.getElementById('msNext').onclick    = () => showLevels(browseWorld + 1);
document.getElementById('endLevels').onclick = () => showLevels(wIdx);
document.getElementById('pauseBtn').onclick  = pause;
['muteBtn', 'msMute'].forEach(id => {
  document.getElementById(id).onclick = e => { e.currentTarget.blur(); Sound.toggle(); showMute(); };
});
document.getElementById('resumeBtn').onclick  = pause;
document.getElementById('restartBtn').onclick = () => startLevel(wIdx, lIdx);
document.getElementById('quitBtn').onclick    = () => showLevels(wIdx);

fit();
Save.update({ mrLevels: WORLDS.length * PER_WORLD });   // so the front page can say "x of 30"
showLevels(0);
requestAnimationFrame(frame);

</script>

<script>
// Phones report "pointer: coarse", but a touchscreen laptop or Chromebook often
// doesn't, so the on-screen buttons never appeared there. This adds a class as
// soon as we see touch support, and the CSS below uses either signal.
if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) document.body.classList.add('hasTouch');
</script>
